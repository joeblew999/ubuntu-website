<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="banGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="openGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>

  <!-- Left side - DJI/Banned -->
  <g transform="translate(200, 180)">
    <!-- Drone silhouette -->
    <g fill="#121212" opacity="0.6">
      <!-- Drone body -->
      <rect x="-30" y="-10" width="60" height="20" rx="5"/>
      <!-- Arms -->
      <rect x="-60" y="-5" width="30" height="10" rx="2" transform="rotate(-30 -30 0)"/>
      <rect x="30" y="-5" width="30" height="10" rx="2" transform="rotate(30 30 0)"/>
      <rect x="-60" y="-5" width="30" height="10" rx="2" transform="rotate(30 -30 0)"/>
      <rect x="30" y="-5" width="30" height="10" rx="2" transform="rotate(-30 30 0)"/>
      <!-- Propellers -->
      <ellipse cx="-50" cy="-25" rx="20" ry="6" opacity="0.4"/>
      <ellipse cx="50" cy="-25" rx="20" ry="6" opacity="0.4"/>
      <ellipse cx="-50" cy="25" rx="20" ry="6" opacity="0.4"/>
      <ellipse cx="50" cy="25" rx="20" ry="6" opacity="0.4"/>
    </g>

    <!-- Ban symbol overlay -->
    <circle r="70" fill="none" stroke="#ff6b6b" stroke-width="6" opacity="0.8"/>
    <line x1="-50" y1="-50" x2="50" y2="50" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Arrow pointing right -->
  <g transform="translate(400, 180)">
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#58a6ff" stroke-width="4"/>
    <polygon points="60,0 45,-12 45,12" fill="#58a6ff"/>
  </g>

  <!-- Right side - Open Source -->
  <g transform="translate(600, 180)">
    <!-- Drone silhouette (same style but active) -->
    <g fill="#121212">
      <!-- Drone body -->
      <rect x="-30" y="-10" width="60" height="20" rx="5"/>
      <!-- Arms -->
      <rect x="-60" y="-5" width="30" height="10" rx="2" transform="rotate(-30 -30 0)"/>
      <rect x="30" y="-5" width="30" height="10" rx="2" transform="rotate(30 30 0)"/>
      <rect x="-60" y="-5" width="30" height="10" rx="2" transform="rotate(30 -30 0)"/>
      <rect x="30" y="-5" width="30" height="10" rx="2" transform="rotate(-30 30 0)"/>
      <!-- Propellers -->
      <ellipse cx="-50" cy="-25" rx="20" ry="6" fill="#58a6ff" opacity="0.6"/>
      <ellipse cx="50" cy="-25" rx="20" ry="6" fill="#58a6ff" opacity="0.6"/>
      <ellipse cx="-50" cy="25" rx="20" ry="6" fill="#58a6ff" opacity="0.6"/>
      <ellipse cx="50" cy="25" rx="20" ry="6" fill="#58a6ff" opacity="0.6"/>
    </g>

    <!-- Open source checkmark -->
    <circle r="70" fill="none" stroke="#58a6ff" stroke-width="3"/>
    <path d="M -25 5 L -5 25 L 30 -20" fill="none" stroke="#58a6ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- FCC Document icon -->
  <g transform="translate(200, 330)">
    <rect x="-25" y="-20" width="50" height="40" rx="3" fill="url(#banGrad)" stroke="#ff6b6b" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="10" font-weight="bold" fill="#121212" text-anchor="middle">FCC</text>
    <line x1="-15" y1="15" x2="15" y2="15" stroke="#121212" stroke-width="2"/>
  </g>

  <!-- PX4/ArduPilot logos (simplified) -->
  <g transform="translate(600, 330)">
    <rect x="-45" y="-20" width="40" height="40" rx="5" fill="url(#openGrad)" stroke="#58a6ff" stroke-width="2"/>
    <text x="-25" y="8" font-family="monospace" font-size="10" font-weight="bold" fill="#121212" text-anchor="middle">PX4</text>

    <rect x="5" y="-20" width="40" height="40" rx="5" fill="url(#openGrad)" stroke="#58a6ff" stroke-width="2"/>
    <text x="25" y="3" font-family="monospace" font-size="8" font-weight="bold" fill="#121212" text-anchor="middle">Ardu</text>
    <text x="25" y="13" font-family="monospace" font-size="8" font-weight="bold" fill="#121212" text-anchor="middle">Pilot</text>
  </g>

  <!-- Labels -->
  <g font-family="sans-serif" fill="#121212">
    <text x="200" y="60" text-anchor="middle" font-size="16" font-weight="bold">DJI Covered List</text>
    <text x="200" y="80" text-anchor="middle" font-size="12" fill="#6e7681">December 22, 2025</text>

    <text x="600" y="60" text-anchor="middle" font-size="16" font-weight="bold">Open Source</text>
    <text x="600" y="80" text-anchor="middle" font-size="12" fill="#6e7681">The Path Forward</text>
  </g>

  <!-- Timeline at bottom -->
  <g transform="translate(400, 380)">
    <line x1="-350" y1="0" x2="350" y2="0" stroke="#6e7681" stroke-width="1"/>
    <!-- Timeline markers -->
    <g fill="#6e7681" font-family="sans-serif" font-size="9">
      <circle cx="-200" cy="0" r="4"/>
      <text x="-200" y="-10" text-anchor="middle">NDAA Passed</text>

      <circle cx="0" cy="0" r="4" fill="#ff6b6b"/>
      <text x="0" y="-10" text-anchor="middle" fill="#ff6b6b">Deadline</text>

      <circle cx="200" cy="0" r="4" fill="#58a6ff"/>
      <text x="200" y="-10" text-anchor="middle" fill="#58a6ff">Transition</text>
    </g>
  </g>
</svg>
