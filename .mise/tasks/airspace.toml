# The FAA airspace data behind the BVLOS demo (/fleet/airspace-demo/): FAA ArcGIS → GeoJSON → PMTiles (tippecanoe if
# installed, else the Go tiler) → R2, only the datasets the FAA changed since what R2 has, so a run with nothing new
# changes nothing (the sync rules: internal/airspace/doc.go). Each task runs one command of the airspace binary,
# cmd/airspace/<command>.go; misecheck holds the two together.
#   mise run airspace:pipeline            sync + tile + manifest, locally (no upload)
#   mise run airspace:upload              the tiles and manifests to R2 (on the repo's login; in CI, the workflow's token)
# The weekly one is .github/workflows/sync-airspace.yml. Serving tiles locally: pmtiles-server:serve.

["airspace:build"]
description = "Build airspace (cmd/airspace) into bin/: the airspace:* tasks run it"
run = 'go build -o bin/ ./cmd/airspace'

["airspace:pipeline"]
description = "Sync, tile and manifest, each step only if something changed (--force: all of them)"
usage = 'flag "--force" help="Every step, changed or not"; flag "--tiler <tiler>" help="auto (default), tippecanoe or gotiler"'
depends = ["airspace:build"]
run = 'airspace pipeline{% if usage.force %} --force{% endif %}{% if usage.tiler %} --tiler "{{usage.tiler}}"{% endif %}'

["airspace:sync"]
description = "The FAA datasets downloaded, only those whose FAA version isn't the one published in R2 (internal/airspace/doc.go)"
usage = 'flag "--force" help="Download every dataset, changed or not"; flag "--skip-large <bool>" help="Skip the datasets over 100MB (default true)"; flag "--timeout <duration>" help="HTTP timeout (default 5m)"'
depends = ["airspace:build"]
run = 'airspace sync{% if usage.force %} --force{% endif %}{% if usage.skip_large %} --skip-large={{usage.skip_large}}{% endif %}{% if usage.timeout %} --timeout {{usage.timeout}}{% endif %}'

["airspace:tile"]
description = "The GeoJSON made into PMTiles, only what's out of date"
usage = 'flag "--dataset <name>" help="One dataset (default: all)"; flag "--force" help="Regenerate even if up to date"; flag "--tiler <tiler>" help="auto (default), tippecanoe or gotiler"'
depends = ["airspace:build"]
run = 'airspace tile{% if usage.dataset %} --dataset "{{usage.dataset}}"{% endif %}{% if usage.force %} --force{% endif %}{% if usage.tiler %} --tiler "{{usage.tiler}}"{% endif %}'

["airspace:manifest"]
description = "The manifests the demo page loads (data/airspace/*manifest.json)"
depends = ["airspace:build"]
run = 'airspace manifest'

["airspace:upload"]
description = "The tiles the last sync built, then the manifests, uploaded to R2 (--test: the endpoints only). wrangler is the npm package's (root:deps): in CI on the workflow's token, here through mise-cloudflare on the repo's login"
usage = 'flag "--test" help="Test the endpoints, upload nothing"'
depends = ["airspace:build", "root:deps"]
run = 'airspace upload{% if usage.test %} --test{% endif %}'

["airspace:upload-list"]
description = "What's in R2 under airspace/ (Cloudflare's cf, on its login: wrangler has no object list)"
run = 'cf r2 objects list --bucket-name ubuntu-website-assets --prefix airspace/'

["airspace:status"]
description = "The local data files"
depends = ["airspace:build"]
run = 'airspace status'

["airspace:history"]
description = "The sync history, for tuning the schedule"
depends = ["airspace:build"]
run = 'airspace history'

["airspace:check"]
description = "Whether the last sync changed anything, as changed=true|false for a workflow's output"
depends = ["airspace:build"]
run = 'airspace check'

["airspace:summary"]
description = "The last sync's summary, as markdown for a workflow's summary"
depends = ["airspace:build"]
run = 'airspace summary'
