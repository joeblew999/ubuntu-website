'''

# ── r2:cors:test ─────────────────────────────────────────────────────────────
["r2:cors:test"]
description = "Test CORS headers from allowed origins (optional TEST_FILE)"
run = '''
#!/usr/bin/env nu

def main [test_file?: string] {
  let tf = ($test_file | default "airspace/manifest.json")
  let base = "https://pub-97cfaeb734ae474c80c79c3e3cc6dbee.r2.dev"
  print "Testing CORS headers..."
  print $"Test file: ($base)/($tf)"
  print ""

  def test-cors [origin: string, url: string] {
    print $"Origin: ($origin)"
    let headers = (^curl -sI -H $"Origin: ($origin)" $url
      | lines | where ($it | str downcase | str starts-with "access-control"))
    if ($headers | is-empty) {
      print "  ✗ No CORS headers"
    } else {
      print "  ✓ CORS enabled"
      $headers | each { |h| print $"    ($h)" }
    }
    print ""
  }

  test-cors "https://www.ubuntusoftware.net" $"($base)/($tf)"
  test-cors "http://localhost:1313" $"($base)/($tf)"
}
'''
