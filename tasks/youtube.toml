# ── youtube:concat ───────────────────────────────────────────────────────────
["youtube:concat"]
description = "Join multiple videos (file1 file2 [file3] [out])"
run = '''
#!/usr/bin/env nu

def main [file1: string, file2: string, file3?: string, out?: string] {
  mut args = [concat]
  if ($out | is-not-empty) { $args = ($args | append [-o $out]) }
  $args = ($args | append [-force $file1 $file2])
  if ($file3 | is-not-empty) { $args = ($args | append $file3) }
  ^go run ./cmd/youtube ...$args
}
'''

# ── youtube:mute ─────────────────────────────────────────────────────────────
["youtube:mute"]
description = "Remove audio track (file [out])"
run = '''
