# ── playwright:cloudflare ────────────────────────────────────────────────────
["playwright:cloudflare"]
description = "Open Cloudflare dashboard in browser (page?, profile defaults to ~/.playwright-cloudflare)"
run = '''
#!/usr/bin/env nu

def main [page?: string] {
  let profile = ($env.PROFILE? | default "~/.playwright-cloudflare")
  if (($page | default "") | is-empty) {
    ^go run ./cmd/playwright $"-profile=($profile)" cloudflare
  } else {
    ^go run ./cmd/playwright $"-profile=($profile)" cloudflare $page
  }
}
'''

# ── playwright:cloudflare:email ──────────────────────────────────────────────
["playwright:cloudflare:email"]
description = "Open Cloudflare Email Routing (domain defaults to ubuntusoftware.net)"
run = '''
#!/usr/bin/env nu

def main [domain: string = "ubuntusoftware.net"] {
  let profile = ($env.PROFILE? | default "~/.playwright-cloudflare")
  ^go run ./cmd/playwright $"-profile=($profile)" cloudflare-email $domain
}
'''

# ── playwright:cloudflare:email:add ──────────────────────────────────────────
["playwright:cloudflare:email:add"]
description = "Add email forwarding rule with HIL automation (from, to, domain?)"
run = '''
#!/usr/bin/env nu

def main [from: string, to: string, domain?: string] {
  let profile = ($env.PROFILE? | default "~/.playwright-cloudflare")
  let dom = (($domain | default "") | default ($from | split row "@" | last))
  ^go run ./cmd/playwright $"-profile=($profile)" cloudflare-email-add $from $to $dom
}
'''

