# ── cf-pages:preview-url ─────────────────────────────────────────────────────
["cf-pages:preview-url"]
description = "Get and open the latest preview deployment URL"
tools = { wrangler = "latest" }
run = '''
#!/usr/bin/env nu

def main [] {
  print "========================================"
  print "Latest Preview Deployment"
  print "========================================"
  let line = (^wrangler pages deployment list --project-name=ubuntu-website
    | lines | where ($it | str contains "Preview") | first)
  let url = (if ($line | is-empty) { "" } else { ($line | split row -r '\s+' | get 9? | default "") })
  if ($url | is-empty) {
    print "No preview deployments found"
  } else {
    print $"URL: ($url)"
    print ""
    print "Opening in browser..."
    ^open $url
  }
}
'''

# ── cf-pages:purge ───────────────────────────────────────────────────────────
["cf-pages:purge"]
description = "Purge Cloudflare CDN cache for the zone"
run = '''
#!/usr/bin/env nu

def main [] {
  let token = ($env.CLOUDFLARE_API_TOKEN? | default "")
  if ($token | is-empty) {
    print --stderr "ERROR: CLOUDFLARE_API_TOKEN must be set in env"
    exit 1
  }
  let zone = ($env.CF_ZONE_ID? | default "")
  print "Purging Cloudflare cache for www.ubuntusoftware.net..."
  let resp = (^curl -s -X POST $"https://api.cloudflare.com/client/v4/zones/($zone)/purge_cache"
    -H $"Authorization: Bearer ($token)"
    -H "Content-Type: application/json"
    --data '{"purge_everything":true}')
  if ($resp | str contains '"success": true') or ($resp | str contains '"success":true') {
    print "OK: Cache purged successfully"
  } else {
    print --stderr "ERROR: Cache purge failed:"
    print --stderr $resp
    exit 1
  }
}
'''

