# ── autotranslate:arb ────────────────────────────────────────────────────────
["autotranslate:arb"]
description = "Translate ARB catalog entries for a language (batch mode)"
run = '''
#!/usr/bin/env nu

def main [lang: string, provider?: string, bundle?: string, dry_run?: string, verbose?: string] {
  if ($lang | is-empty) {
    print --stderr "✗ LANG is required"
    exit 1
  }
  mut args = [$"--provider=($provider | default 'deepl')" $"--bundle=($bundle | default 'tokibundle')"]
  if ($dry_run | default "false") == "true" { $args = ($args | append "--dry-run") }
  if ($verbose | default "false") == "true" { $args = ($args | append "--verbose") }
  $args = ($args | append ["arb" $lang])
  ^go run ./cmd/autotranslate ...$args
}
'''

