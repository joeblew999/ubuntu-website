#:schema https://mise.jdx.dev/schema/mise.json

# ubuntu-website's control plane: every tool pinned (Taskfiles never install tools: add new ones to [tools]), the
# settings and env every task runs with, and the tasks that act on the whole repo. The work itself is in task files,
# one per Go binary, .mise/tasks/<binary>.toml: tasks named <binary>:<command>, each running <binary> <command>
# (cmd/<binary>/<command>.go), built into bin/ by <binary>:build. They carry no tools or env of their own.
#
#   mise run root:ci            what CI runs, the same here: every check below (CI's workflow runs only this)
#   mise run root:check-mise    misecheck on this file and every task file: each held to its own binary, both ways
#   mise run root:test          the Go: vet and tests of every package, and the Workers build (js/wasm) vetted
#   mise run root:build         the site, as production builds it
#   mise run root:pages         Cloudflare Pages' build: root:build, with only the tools it runs installed
#   mise tasks                  every task, with its file
#
# New machine: mise trust && mise install, then the domain's own first steps (e.g. .mise/tasks/google-mcp.toml's).
# Not yet moved here: the Taskfiles (task …), domain by domain (TODO.md).

# The mise CI (core-ci.yml) and Cloudflare Pages (its build command, root:pages) run, exactly; anywhere else, at least.
min_version = "2026.9.15"

[settings]
# go.mod's toolchain line is the Go pin; this makes `mise install` honour it.
idiomatic_version_file_enable_tools = ["go"]
# npm: tools (wrangler) are installed by mise's own embedded aube, the package manager the site uses too.
npm.package_manager = "aube"

[tools]
# CI + Taskfile tools (were installed by separate GitHub Actions / npm -g)
task = "3.54.0"
# Local, CI and Cloudflare Pages (root:pages installs it there); see CLAUDE.md Hugo Version.
hugo-extended = "0.169.0"
"npm:wrangler" = "4.156.1"
# node is the one JavaScript runtime (Hugo's Tailwind, the theme generator); aube installs the site's npm packages
# (package.json, aube-lock.yaml, build approvals in aube-workspace.yaml), and only that.
node = "26.13.0"
aube = "2.9.0"
# Dev process orchestration (task dev:up / process-compose.yaml); not in Homebrew core.
process-compose = "1.124.0"
# GitHub CLI (tools:gh:*, release tasks).
gh = "2.103.3"
# Google API enablement (google-mcp:tf:*, terraform/google-mcp).
terraform = "1.17.1"
# Google MCP server (.mcp.json): upstream release binary, exact version.
"github:ngs/google-mcp-server" = "0.8.0"
# Resolves the server's GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET from the keychain (fnox.toml).
fnox = "1.46.0"
# JSON in task tools:upgrade.
jq = "1.8.2"
# The GitHub workflows, linted (root:check-workflows, in root:ci); actionlint checks their run steps with shellcheck.
actionlint = "1.7.12"
shellcheck = "0.11.0"
# The workflows' actions pinned to commit SHAs (root:check-actions, in root:ci), and updated (root:upgrade-actions).
pinact = "5.0.2"
# Git LFS: static/videos/*.mp4 are LFS files (.gitattributes).
git-lfs = "3.8.1"
# Go module upgrades incl. major versions (task go:upgrade).
"aqua:oligot/go-mod-upgrade" = "0.13.0"

[env]
# Google Cloud project (number) that owns the OAuth client. Not secret.
UBUNTU_WEBSITE_GCP_PROJECT = "130034768106"
# Each <binary>:build puts its binary here; the tasks run it by name.
_.path = ["{{config_root}}/bin"]

[task_config]
# The task files, one per Go binary (mise loads this folder by default; named here so the control plane says so).
includes = [".mise/tasks"]

[tasks."root:check-mise"]
description = "misecheck (github.com/joeblew999/mise-check) on every mise file here: this one, and each .mise/tasks/<binary>.toml strictly against cmd/<binary>/ (each command a task, each task's command there, the task names its Go prints all tasks): one line each, usage passed by name, no POSIX shell syntax"
run = 'go test . -run "^TestMise$" -count=1 -v'

[tasks."root:ci"]
description = "What CI runs, and the same here: misecheck, the workflows linted and their actions pinned, the Go, the theme CSS current, the site's production build (and, until they're gone, the Taskfiles parsed). CI's workflow runs only this task"
depends = ["root:check-mise", "root:check-workflows", "root:check-actions", "root:test", "root:test-worker", "theme:check", "root:build", "root:check-taskfiles"]

[tasks."root:check-workflows"]
description = "The GitHub workflows (.github/workflows/*.yml) linted with actionlint: YAML, expressions, action inputs, and the shell of their run steps"
run = 'actionlint'

[tasks."root:check-actions"]
description = "Every action the workflows use is pinned to a commit SHA with its version as a comment (pinact, offline: no GitHub API, no token)"
run = 'pinact run --fix=false --no-api'

[tasks."root:upgrade-actions"]
description = "Update the workflows' actions to their latest releases at least a week old (.github/pinact.yaml), pinned to SHAs; GitHub's API with your gh login (task upgrade runs it)"
env = { PINACT_GITHUB_TOKEN = "{{ exec(command='gh auth token') }}" }
run = 'pinact run --update'

[tasks."root:test"]
description = "The Go: go vet and the tests of every package"
run = 'go vet ./... && go test ./... -count=1'

[tasks."root:test-worker"]
description = "The Workers build of cmd/worker-tiler (js/wasm), vetted: go vet ./... doesn't build it"
env = { GOOS = "js", GOARCH = "wasm" }
run = 'go vet ./cmd/worker-tiler'

[tasks."root:deps"]
description = "The site's npm packages (Tailwind and its plugins), with aube from aube-lock.yaml: it fails if the lockfile and package.json disagree, and on any dependency build script not reviewed (aube-workspace.yaml)"
run = 'aube install --frozen-lockfile'

[tasks."root:build"]
description = "The site as production builds it (hugo -e production --gc --minify) into public/, with the theme CSS as committed (theme:check): refLinksErrorLevel makes a broken relref fail it. Preview builds are the same build"
depends = ["root:deps"]
run = 'hugo -e production --gc --minify'

[tasks."root:pages"]
description = "Cloudflare Pages' build, production and preview: its build command is npx -y @jdxcode/mise@<min_version> run --skip-tools root:pages. It installs only the tools root:build runs, not every pin, then runs it"
run = 'mise install hugo-extended node aube && mise run --skip-tools root:build'

[tasks."root:check-taskfiles"]
description = "The Taskfiles still parse, until their tasks have all moved here (TODO.md)"
run = 'task --list-all'
