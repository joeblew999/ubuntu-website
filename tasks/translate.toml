# tasks/translate.toml — translate:* namespace: translation workflow management. Ported from taskfiles/Taskfile.translate.yml.

# ── translate:content:status ─────────────────────────────────────────────────
["translate:content:status"]
description = "Show what English files changed since last translation"
run = '''
#!/usr/bin/env nu

def main [github_issue?: string] {
  if ($github_issue | default "false") == "true" {
    ^go run ./cmd/translate -github-issue content status
  } else {
    ^go run ./cmd/translate content status
  }
}
'''

# ── translate:content:next ───────────────────────────────────────────────────
["translate:content:next"]
description = "Show next file to translate (with progress indicator)"
run = '''
#!/usr/bin/env nu

def main [] {
  ^go run ./cmd/translate content next
}
'''

# ── translate:content:diff ───────────────────────────────────────────────────
["translate:content:diff"]
description = "Show git diff for a specific English file since last translation"
run = '''
#!/usr/bin/env nu

def main [file: string] {
  if ($file | is-empty) {
    print --stderr "✗ FILE is required"
    exit 1
  }
  ^go run ./cmd/translate content diff $file
}
'''

# ── translate:content:changed ────────────────────────────────────────────────
["translate:content:changed"]
description = "Show detailed changes for all English files since last translation"
run = '''
#!/usr/bin/env nu

def main [] {
