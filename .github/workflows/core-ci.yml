# core-ci: the repo's checks, as the control plane, mise.toml, defines them. CI runs mise run root:ci and nothing else,
# so a check is added in one place (a task root:ci depends on) and runs the same here and on any machine.
name: core-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.15
          cache: true

      - name: mise run root:ci (mise.toml says what that is)
        run: mise run root:ci
