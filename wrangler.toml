name = "ubuntusoftware-net"
compatibility_date = "2024-01-01"

# Cloudflare Pages configuration
# Build command (project setting): mise runs root:pages, the control plane's build (mise.toml; CLAUDE.md)
# The 'public' directory is deployed to Cloudflare Pages
pages_build_output_dir = "public"

# Build variables (with this file, Pages builds read theirs from here). The build installs the npm packages itself,
# with aube (root:pages → root:deps): skip the image's own unpinned npm install.
[vars]
SKIP_DEPENDENCY_INSTALL = "true"
