# ── toki:md:apply ────────────────────────────────────────────────────────────
["toki:md:apply"]
description = "Apply translations from ARB to markdown (lang: de, zh, ja, vi)"
depends = ["toki:build"]
run = '''
#!/usr/bin/env nu

def main [lang: string] {
  let dir = ($env.BIN_INSTALL_DIR? | default ".bin")
  let bin = ($dir | path expand | path join "toki")
  let content = ($env.ROOT_DIR? | default "." | path join "content")
  let bundle = ($env.ROOT_DIR? | default "." | path join "tokibundle")
  let target = (match $lang {
    "vi" => "vietnamese",
    "de" => "german",
    "zh" => "chinese",
    "ja" => "japanese",
    _ => $lang,
  })
  ^$bin apply -md ($content | path join "english") -out ($content | path join $target) -b $bundle -t $lang -v
}
'''

# ── toki:md:apply:all ────────────────────────────────────────────────────────
["toki:md:apply:all"]
description = "Apply all translations (de, zh, ja, vi)"
depends = ["toki:build"]
run = '''
#!/usr/bin/env nu

def main [] {
  let dir = ($env.BIN_INSTALL_DIR? | default ".bin")
  let bin = ($dir | path expand | path join "toki")
  let content = ($env.ROOT_DIR? | default "." | path join "content")
  let bundle = ($env.ROOT_DIR? | default "." | path join "tokibundle")
  for pair in [[lang target]; ["vi" "vietnamese"] ["de" "german"] ["zh" "chinese"] ["ja" "japanese"]] {
    ^$bin apply -md ($content | path join "english") -out ($content | path join $pair.target) -b $bundle -t $pair.lang -v
  }
}
'''
