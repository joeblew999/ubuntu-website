# tasks/genlogo.toml — genlogo:* namespace: logo and branding asset generation. Ported from taskfiles/Taskfile.genlogo.yml.

# ── genlogo:generate:all ─────────────────────────────────────────────────────
["genlogo:generate:all"]
description = "Generate all branding assets (favicon, logos, og-image, email-logo, avatar, banner)"
run = '''
#!/usr/bin/env nu

def main [] {
  let root = (^git rev-parse --show-toplevel | str trim)
  ^go run ./cmd/genlogo -asset all -dir $root
  print ""
  print "Assets generated. Next steps:"
  print "  1. Deploy website (git push) - updates Hugo site with new favicon, logos, og-image"
  print "  2. Gmail signature - re-upload email-logo.png at https://mail.google.com/mail/u/0/#settings/general"
  print "  3. Bluesky profile - re-upload avatar & banner at https://bsky.app/profile/ubuntusoftware.net"
}
'''

