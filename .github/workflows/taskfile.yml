# taskfile - Taskfile Validation
#
# Validates Taskfile works correctly.
# Tests includes mechanism and variable expansion.
# Runs on push to main and PRs to catch issues early.

name: taskfile

on:
  push:
    branches: [main]
    paths:
      - 'Taskfile.yml'
      - 'taskfiles/**'
      - '.github/workflows/taskfile.yml'
  pull_request:
    paths:
      - 'Taskfile.yml'
      - 'taskfiles/**'
      - '.github/workflows/taskfile.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.15
          cache: true




      - name: Install dependencies
        run: bun install

      - name: Validate Taskfile syntax
        run: task --list

      - name: Test Hugo build task
        run: task hugo:build
