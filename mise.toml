# mise-en-place configuration — https://mise.jdx.dev
#
# Follows the house convention from joeblew999/.github (shared mise task
# library, consumed by-reference; identical locally and in CI):
#   - generic tooling (cf, gh, wrangler, fnox, ci, release, secrets) is
#     INCLUDED BY-REFERENCE from the shared library — never copied.
#   - project-specific tasks live in local tasks/*.toml as inline nushell.
#   - secrets come from fnox; nushell is the task scripting language.
#
# Additive during migration: coexists with the existing Taskfile (mise keeps
# `task` as a managed tool) until parity is verified. See MISE_MIGRATION.md.

[tools]
# --- project runtimes ---
go = "1.25"                        # matches go.mod (go 1.25.4)
node = "lts"                       # Hugo Plate theme build (tailwind)
hugo-extended = "0.152.2"          # extended build required by Hugo Plate (v0.144+)
# --- shared toolchain (matches joeblew999/.github) ---
"github:nushell/nushell" = "latest"  # task scripting language
fnox = "latest"                      # secret manager
gh = "latest"                        # GitHub CLI (used by shared tool-gh)
jq = "latest"                        # JSON wrangling in tasks
usage = "latest"                     # arg-spec parsing for tasks
task = "latest"                      # go-task — kept during migration for coexistence

[env]
# Project-level, non-secret env (mirrors the Taskfile `vars:` block).
# Secrets are NOT here — they come from fnox (see below).
CF_ACCOUNT_ID = "7384af54e33b8a54ff240371ea368440"
CF_ZONE_ID = "867fb5996096b895b47114b6564ee0fb"
CF_WEB_ANALYTICS_SITE_TAG = "4c28a6bfb5514996914a603c999d5c79"
CGO_ENABLED = "1"
# Local .env still works during migration (auto-loaded by mise).
_.file = ".env"

# --- fnox secret integration (enable once `fnox init` is configured) ---
# Loads secrets (CLOUDFLARE_API_TOKEN, MAILERLITE_API_KEY, DEEPL_API_KEY, ...)
# as env vars. Left commented so `mise install` never fails on a missing
# plugin/config before secrets are migrated. See MISE_MIGRATION.md.
#
# [plugins]
# fnox-env = "https://github.com/jdx/mise-env-fnox"
#
# [env]
# _.fnox-env = { tools = true }

[task_config]
# Pin ?ref= to a release tag for production; `main` is the rolling ref.
includes = [
  # --- shared library, by-reference (generic tooling) ---
  "git::https://github.com/joeblew999/.github.git//tasks/mise.toml?ref=main",
  "git::https://github.com/joeblew999/.github.git//tasks/tool-fnox.toml?ref=main",
  "git::https://github.com/joeblew999/.github.git//tasks/secrets.toml?ref=main",
  "git::https://github.com/joeblew999/.github.git//tasks/tool-cf.toml?ref=main",
  "git::https://github.com/joeblew999/.github.git//tasks/tool-gh.toml?ref=main",
  "git::https://github.com/joeblew999/.github.git//tasks/tool-wrangler.toml?ref=main",

  # --- project-specific tasks (local; inline nushell) ---
  "tasks/hugo.toml",
  "tasks/analytics.toml",
  "tasks/sitecheck.toml",
  "tasks/mailerlite.toml",
  "tasks/translate.toml",
  "tasks/autotranslate.toml",
  "tasks/youtube.toml",
  "tasks/google.toml",
  "tasks/google-mcp.toml",
  "tasks/airspace.toml",
  "tasks/genlogo.toml",
  "tasks/vanityimport.toml",
  "tasks/env.toml",
  "tasks/url.toml",
  "tasks/lanip.toml",
  "tasks/toki.toml",
  "tasks/playwright.toml",
  "tasks/cf.toml",
  "tasks/r2.toml",
  "tasks/workers.toml",
  "tasks/dev.toml",
  "tasks/secrets.toml",
]
