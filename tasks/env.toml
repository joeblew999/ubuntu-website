# tasks/env.toml — env:* namespace: environment management/validation. Ported from taskfiles/Taskfile.env.yml.

# ── env:validate ─────────────────────────────────────────────────────────────
["env:validate"]
description = "Validate .env file (fast format checks)"
run = '''
#!/usr/bin/env nu

def main [] {
  ^go run ./cmd/env validate
}
'''

