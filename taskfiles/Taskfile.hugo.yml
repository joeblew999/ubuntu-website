# Hugo Tasks
#
# Hugo static site generator commands for development,
# building, and preview.
#
# Usage:
#   task hugo:dev       - Start development server
#   task hugo:build     - Build production site
#   task hugo:preview   - Preview production build
#   task hugo:clean     - Clean build artifacts
#
# Aliases (backward compat):
#   task dev            - hugo:dev
#   task build          - hugo:build
#   task preview        - hugo:preview
#   task clean          - hugo:clean

version: '3'

tasks:
  # ===========================================================================
  # Development
  # ===========================================================================

  dev:
    desc: Start Hugo development server
    cmds:
      - |
        CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown")

        echo "========================================"
        echo "Hugo Development Server"
        echo "========================================"
        echo ""
        if [ "$CURRENT_BRANCH" = "main" ]; then
          echo "Branch: MAIN (production)"
        else
          echo "Branch: $CURRENT_BRANCH (preview)"
        fi
        echo ""
        echo "Local URL: {{.URL_DEV}}"
        LAN_IP=$(go run ./cmd/lanip 2>/dev/null || echo "unknown")
        echo "LAN URL:   http://$LAN_IP:1313"
        echo ""
        echo "Quick Commands:"
        echo "  task url:dev       - Open in browser"
        echo "  task hugo:dev:lan  - Start with LAN baseURL (for mobile)"
        echo "  Ctrl+C             - Stop server"
        echo "========================================"
        echo ""
      - hugo server {{.HUGO_DEV_FLAGS}} --bind 0.0.0.0

  dev:lan:
    desc: Start Hugo dev server with LAN IP (for mobile testing)
    cmds:
      - |
        LAN_IP=$(go run ./cmd/lanip 2>/dev/null || echo "127.0.0.1")
        echo "========================================"
        echo "Hugo Development Server (LAN Mode)"
        echo "========================================"
        echo ""
        echo "LAN URL: http://$LAN_IP:1313"
        echo ""
        echo "Use this URL on your mobile device"
        echo "========================================"
        echo ""
        hugo server {{.HUGO_DEV_FLAGS}} --bind 0.0.0.0 --baseURL "http://$LAN_IP:1313"

  # ===========================================================================
  # Build
  # ===========================================================================

  build:
    desc: Build production site
    cmds:
      - hugo {{.HUGO_BUILD_FLAGS}}

  preview:
    desc: Preview production build
    cmds:
      - hugo server {{.HUGO_PREVIEW_FLAGS}}

  # ===========================================================================
  # Upgrade
  # ===========================================================================

  upgrade:
    desc: Upgrade Hugo (VERSION=x.y.z, default latest) - pin, build check, Cloudflare preview
    summary: |
      Hugo is pinned in mise.toml (local + CI) and in Cloudflare Pages' HUGO_VERSION (production
      and preview). This pins the new version, proves a production build, and switches preview.
      Production switches only after the preview build of your branch passes (printed at the end).
    dir: '{{.ROOT_DIR}}'
    vars:
      VERSION: '{{.VERSION | default ""}}'
    cmds:
      - |
        set -euo pipefail
        v="{{.VERSION}}"
        [ -n "$v" ] || v=$(mise latest hugo-extended)
        pin=$(mise config get -f mise.toml tools.hugo-extended)
        echo "Hugo $pin → $v"
        mise use --pin --path mise.toml hugo-extended@$v
        out=$(mktemp -d)
        if ! mise exec -- hugo -e production --gc --minify -d "$out" > "$out.log" 2>&1; then
          grep -E "^(ERROR|Error)" "$out.log" | head -5
          echo "✗ production build fails on Hugo $v; mise.toml left at $v - revert with: mise use --pin --path mise.toml hugo-extended@$pin"
          exit 1
        fi
        grep -E "^WARN|Pages |Total in" "$out.log" || true
        rm -rf "$out" "$out.log"
      - task: ':cf:hugo-version'
        vars: { ENV: preview }
      - |
        echo ""
        echo "Next: commit on a branch and push it; when the Cloudflare preview build passes:"
        echo "  task cf:hugo-version ENV=production && merge the branch to main"

  # ===========================================================================
  # Clean
  # ===========================================================================

  clean:
    desc: Clean build artifacts
    cmds:
      - '{{.XPLAT_BIN}} rm -rf {{.DIR_PUBLIC}} {{.DIR_RESOURCES}} {{.FILE_HUGO_LOCK}}'
