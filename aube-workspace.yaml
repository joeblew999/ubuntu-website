# aube's project settings (mise.toml pins aube; root:deps installs with it).
#
# Dependency build scripts run only when allowed here or by aube's built-in trusted list; this makes an unreviewed one
# fail the install, and so CI, rather than be skipped: review it with `aube ignored-builds`, then `aube approve-builds`
# (or deny it with false here).
strictDepBuilds: true
# Packages are real files in node_modules/.aube/, never links into aube's shared cache (~/.cache/aube): Hugo runs
# Tailwind under Node's permission model, which reads only inside the project. CI already installs this way.
enableGlobalVirtualStore: false
