# tasks/autotranslate.toml — autotranslate:* namespace: automatic DeepL/Claude translation. Ported from taskfiles/Taskfile.autotranslate.yml.

# ── autotranslate:file ───────────────────────────────────────────────────────
["autotranslate:file"]
description = "Translate a single file to target language"
run = '''
#!/usr/bin/env nu

def main [file: string, lang: string, provider?: string, dry_run?: string, verbose?: string] {
  if ($file | is-empty) or ($lang | is-empty) {
    print --stderr "✗ FILE and LANG are required"
    exit 1
  }
  mut args = [$"--provider=($provider | default 'deepl')"]
  if ($dry_run | default "false") == "true" { $args = ($args | append "--dry-run") }
  if ($verbose | default "false") == "true" { $args = ($args | append "--verbose") }
  $args = ($args | append ["file" $file $lang])
  ^go run ./cmd/autotranslate ...$args
}
'''

