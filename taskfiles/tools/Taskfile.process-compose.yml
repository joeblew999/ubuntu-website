# Process-Compose Tasks
#
# Local development process orchestration with health checks and auto-restart.
#
# Usage:
#   task pc:up              Start all dev processes with TUI dashboard
#   task pc:down            Stop all processes
#   task pc:logs            View combined logs
#   task pc:status          Show process status
#   task pc:attach          Attach to running TUI
#
# Documentation: https://github.com/F1bonacc1/process-compose

version: '3'

vars:
  PC_CMD: process-compose
  PC_PORT: 8099

tasks:
  # ===========================================================================
  # Checks (check:* - lifecycle phase)
  # ===========================================================================

  check:deps:
    desc: Ensure process-compose is installed
    internal: true
    status:
      - command -v process-compose
    cmds:
      - echo "Installing process-compose (pinned in mise.toml)..."
      - mise install process-compose

  # ===========================================================================
  # Core Commands (up/down/logs/status)
  # ===========================================================================

  up:
    desc: Start all dev processes with TUI dashboard
    deps: [check:deps]
    cmds:
      - '{{.PC_CMD}} up -p {{.PC_PORT}}'

  up:detached:
    desc: Start dev processes in background (no TUI)
    deps: [check:deps]
    cmds:
      - '{{.PC_CMD}} up -p {{.PC_PORT}} -D'

  attach:
    desc: Attach to running process-compose TUI
    deps: [check:deps]
    cmds:
      - '{{.PC_CMD}} attach -p {{.PC_PORT}}'

  down:
    desc: Stop all dev processes
    deps: [check:deps]
    cmds:
      - '{{.PC_CMD}} down -p {{.PC_PORT}}'

  logs:
    desc: View combined process logs
    deps: [check:deps]
    cmds:
      - '{{.PC_CMD}} logs -p {{.PC_PORT}}'

  status:
    desc: Show process status
    deps: [check:deps]
    cmds:
      - '{{.PC_CMD}} process list -p {{.PC_PORT}}'

  # ===========================================================================
  # Process Control
  # ===========================================================================

  restart:
    desc: Restart a specific process (PROCESS=hugo)
    deps: [check:deps]
    requires:
      vars: [PROCESS]
    cmds:
      - '{{.PC_CMD}} process restart {{.PROCESS}} -p {{.PC_PORT}}'

  stop:
    desc: Stop a specific process (PROCESS=hugo)
    deps: [check:deps]
    requires:
      vars: [PROCESS]
    cmds:
      - '{{.PC_CMD}} process stop {{.PROCESS}} -p {{.PC_PORT}}'

  start:
    desc: Start a specific process (PROCESS=hugo)
    deps: [check:deps]
    requires:
      vars: [PROCESS]
    cmds:
      - '{{.PC_CMD}} process start {{.PROCESS}} -p {{.PC_PORT}}'
