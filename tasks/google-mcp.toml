# ── google-mcp:tf:auth ───────────────────────────────────────────────────────
["google-mcp:tf:auth"]
description = "Authenticate gcloud for Terraform (opens browser)"
run = '''
#!/usr/bin/env nu

def main [] {
  let authed = (do { ^gcloud auth application-default print-access-token } | complete | get exit_code) == 0
  if $authed {
    print "✅ Already authenticated with gcloud"
    print ""
    print "To re-authenticate, run:"
    print "  gcloud auth application-default revoke"
    print "  task google-mcp:tf:auth"
  } else {
    print "Starting OAuth flow..."
    ^go run ./cmd/google-auth gcloud-auth
  }
}
'''

# ── google-mcp:tf:auth:auto ──────────────────────────────────────────────────
["google-mcp:tf:auth:auto"]
description = "Authenticate with embedded Playwright (fully automated)"
run = '''
#!/usr/bin/env nu

def main [timeout?: string] {
  let t = ($timeout | default "180")
  ^go run ./cmd/google-auth gcloud-auth -auto $"-timeout=($t)"
}
'''

# ── google-mcp:tf:auth:passkey ───────────────────────────────────────────────
["google-mcp:tf:auth:passkey"]
description = "Authenticate with passkey (opens default browser; ACCOUNT, TIMEOUT)"
run = '''
#!/usr/bin/env nu

def main [account?: string, timeout?: string] {
  let acct = ($account | default "")
  let t = ($timeout | default "180")
  ^go run ./cmd/google-auth gcloud-auth -assisted $"-account=($acct)" $"-timeout=($t)"
}
'''

