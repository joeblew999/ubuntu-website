# tasks/mailerlite.toml — mailerlite:* namespace: MailerLite subscriber management. Ported from taskfiles/Taskfile.mailerlite.yml.

# ── mailerlite:check ─────────────────────────────────────────────────────────
["mailerlite:check"]
description = "Run all verification checks (API connection, groups, webhooks)"
run = '''
#!/usr/bin/env nu

def main [] {
  print "╔══════════════════════════════════════════════════════════════╗"
  print "║         MailerLite Verification                              ║"
  print "╚══════════════════════════════════════════════════════════════╝"
  print ""
  ^go run ./cmd/mailerlite stats
  print ""
  ^go run ./cmd/mailerlite groups list
  print ""
  ^go run ./cmd/mailerlite webhooks list
  print ""
  ^go run ./cmd/mailerlite releases latest
}
'''

