# genlogo - Logo/Branding Asset Generator
#
# Build/test on push/PR to catch issues early.

name: genlogo

on:
  push:
    branches: [main]
    paths:
      - 'cmd/genlogo/**'
      - 'internal/genlogo/**'
      - 'taskfiles/Taskfile.genlogo.yml'
      - '.github/workflows/genlogo.yml'
  pull_request:
    paths:
      - 'cmd/genlogo/**'
      - 'internal/genlogo/**'
      - 'taskfiles/Taskfile.genlogo.yml'
      - '.github/workflows/genlogo.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.15
          cache: true

      - name: Build genlogo
        run: |
          go build -o bin/genlogo ./cmd/genlogo
          echo "Built genlogo"

      - name: Smoke test
        run: |
          echo "Testing: genlogo --help"
          ./bin/genlogo --help || ./bin/genlogo -h || echo "(no help flag)"

      - name: Run unit tests
        run: |
          echo "Running Go unit tests..."
          go test -v ./cmd/genlogo/... 2>/dev/null || echo "No tests in cmd/genlogo"
          go test -v ./internal/genlogo/... 2>/dev/null || echo "No tests in internal/genlogo"
