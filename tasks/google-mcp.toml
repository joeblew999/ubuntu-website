# ── google-mcp:tf:init ───────────────────────────────────────────────────────
["google-mcp:tf:init"]
description = "Initialize Terraform for Google API setup"
run = '''
#!/usr/bin/env nu

def main [] {
  let dir = $"($env.PWD)/terraform/google-mcp"
  if ($"($dir)/.terraform" | path exists) {
    print "✅ Already initialized"
    return
  }
  cd $dir
  ^terraform init
}
'''

# ── google-mcp:tf:plan ───────────────────────────────────────────────────────
["google-mcp:tf:plan"]
description = "Plan Google API enablement"
depends = ["google-mcp:tf:init"]
run = '''
#!/usr/bin/env nu

def main [] {
  let dir = $"($env.PWD)/terraform/google-mcp"
