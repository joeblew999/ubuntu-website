# ── google-mcp:uninstall ─────────────────────────────────────────────────────
["google-mcp:uninstall"]
description = "Remove Google MCP Server (CONFIRM=y to actually remove)"
run = '''
#!/usr/bin/env nu

def main [confirm?: string] {
  let bin = $"($env.PWD)/.build/google-mcp-server"
  let accounts_dir = $"($env.HOME)/.google-mcp-accounts"
  let c = ($confirm | default "")

  print "This will remove:"
  print "  - Google MCP Server binary"
  print $"  - Authenticated accounts (($accounts_dir))"
  print ""

  if $c != "y" {
    print "Dry run - nothing removed."
    print ""
    print "To actually remove, run:"
    print "  task google-mcp:uninstall CONFIRM=y"
    exit 0
  }

  rm -f $bin
  rm -rf $accounts_dir
  print "✅ Removed"
  print ""
  print "Run 'task google-mcp:claude:remove' to remove from Claude MCP config"
}
'''

# ── google-mcp:reset ─────────────────────────────────────────────────────────
["google-mcp:reset"]
description = "Full reset - remove ALL local config and guide through Google Console cleanup (CONFIRM=y)"
run = '''
#!/usr/bin/env nu

def main [confirm?: string] {
  let accounts_dir = $"($env.HOME)/.google-mcp-accounts"
  let env_file = $"($env.PWD)/.env"
  let c = ($confirm | default "")

  print "╔══════════════════════════════════════════════════════════════╗"
  print "║         Google MCP - Full Reset                              ║"
  print "╚══════════════════════════════════════════════════════════════╝"
  print ""
  print "This will remove:"
  print ""
  print "LOCAL FILES:"
  print "  • .vscode/mcp.json (MCP server config)"
  print "  • .claude/settings.json (permissions)"
  print $"  • ($accounts_dir)/ (authenticated accounts)"
  print "  • GOOGLE_CLIENT_ID/SECRET from .env"
  print ""
  print "GOOGLE CLOUD (manual):"
  print "  • OAuth credentials (will open browser)"
  print ""

  if $c != "y" {
    print "────────────────────────────────────────────────────────────────"
    print "DRY RUN - nothing removed yet"
    print ""
    print "To actually reset, run:"
    print "  task google-mcp:reset CONFIRM=y"
    print "────────────────────────────────────────────────────────────────"
    exit 0
  }

  print "────────────────────────────────────────────────────────────────"
  print "Removing local files..."
  print "────────────────────────────────────────────────────────────────"

  # Remove MCP config
  if (".vscode/mcp.json" | path exists) {
    rm -f ".vscode/mcp.json"
    print "✅ Removed .vscode/mcp.json"
  } else {
    print "⏭️  .vscode/mcp.json (not found)"
  }

  # Remove Claude permissions
  if (".claude/settings.json" | path exists) {
    rm -f ".claude/settings.json"
    print "✅ Removed .claude/settings.json"
  } else {
    print "⏭️  .claude/settings.json (not found)"
  }

  # Remove authenticated accounts
  if ($accounts_dir | path exists) {
    rm -rf $accounts_dir
    print $"✅ Removed ($accounts_dir)/"
  } else {
    print $"⏭️  ($accounts_dir)/ (not found)"
  }

  # Remove credentials from .env
  if (($env_file | path exists) and ((open --raw $env_file) | str contains "GOOGLE_CLIENT")) {
    let kept = (open --raw $env_file | lines | where { |l| not (($l | str starts-with "GOOGLE_CLIENT_ID=") or ($l | str starts-with "GOOGLE_CLIENT_SECRET=") or ($l | str starts-with "# Google MCP")) })
    $kept | str join "\n" | save --force $env_file
    print "✅ Removed Google credentials from .env"
  } else {
    print "⏭️  .env Google credentials (not found)"
  }

  print ""
  print "────────────────────────────────────────────────────────────────"
  print "Opening Google Cloud Console..."
  print "────────────────────────────────────────────────────────────────"
  print ""
  print "To complete the reset, delete your OAuth credentials:"
  print "  1. Find your OAuth 2.0 Client ID"
  print "  2. Click the trash icon to delete it"
  print "  3. (Optional) Delete the entire project if not used elsewhere"
  print ""
  ^open "https://console.cloud.google.com/apis/credentials"

  print ""
  print "════════════════════════════════════════════════════════════════"
  print "✅ LOCAL RESET COMPLETE"
  print ""
  print "To set up again from scratch:"
  print "  task google-mcp:guide"
  print "════════════════════════════════════════════════════════════════"
}
'''

