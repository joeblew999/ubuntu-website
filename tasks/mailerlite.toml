# ── mailerlite:server ────────────────────────────────────────────────────────
["mailerlite:server"]
description = "Start webhook server to receive Web3Forms submissions (port default 8086, group_id optional)"
run = '''
#!/usr/bin/env nu

def main [port?: int, group_id?: string] {
  mut args = ["server" $"PORT=($port | default 8086)"]
  let gid = ($group_id | default "")
  if not ($gid | is-empty) {
    $args = ($args | append $"GROUP_ID=($gid)")
  }
  ^go run ./cmd/mailerlite ...$args
}
'''

