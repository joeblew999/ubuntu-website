# ── youtube:edit:visual-inertial-nav ─────────────────────────────────────────
["youtube:edit:visual-inertial-nav"]
description = "Process visual-inertial navigation demo for website"
run = '''
#!/usr/bin/env nu

def main [] {
  let input = "static/videos/cache/visual-inertial-navigation-module-demo.mp4"
  let trimmed = "static/videos/cache/visual-inertial-navigation-module-demo-trimmed.mp4"
  let output = "static/videos/visual-inertial-nav-edited.mp4"
  let logo = "assets/images/favicon.png"
  print "=== Processing visual-inertial navigation demo ==="
  print "Source https://www.youtube.com/watch?v=cjNkLobw2Cw"
  print ""
  print "Step 1 Trim first 5 seconds to remove intro text"
  ^go run ./cmd/youtube trim -start 5 -o $trimmed -force $input
  print ""
  print "Step 2 Add Ubuntu Software logo (resolution independent)"
  ^go run ./cmd/youtube overlay -image $logo -pos bottomright -o $output -force $trimmed
  print ""
  print "Step 3 Cleanup intermediate files"
  rm -f $trimmed
  print ""
  print "=== Done ==="
  ^go run ./cmd/youtube probe $output
  print ""
  print "Hugo shortcode:"
  print "  video src=videos/visual-inertial-nav-edited.mp4"
}
'''

