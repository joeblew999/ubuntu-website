# The Google MCP server Claude Code runs from .mcp.json (mise exec -- fnox exec -- google-mcp-server): its setup and
# its check. Each task runs one command of the google-mcp binary, cmd/google-mcp/<command>.go; misecheck holds the two
# together (mise run root:check-mise). New machine, once the Google Cloud side exists:
#   mise run google-mcp:setup                         # client id/secret → keychain (hidden prompts), sign in, check
# Google Cloud side (no API for these screens): mise run google-mcp:console; its APIs: google-mcp:tf-apply.
# Routine: google-mcp:status, google-mcp:check, google-mcp:rotate (new client secret), google-mcp:auth (after
# invalid_grant), google-mcp:reset --yes (every account signed out).

["google-mcp:build"]
description = "Build google-mcp (cmd/google-mcp) into bin/: the google-mcp:* tasks run it"
run = 'go build -o bin/ ./cmd/google-mcp'

["google-mcp:secret"]
description = "Store GOOGLE_CLIENT_ID or GOOGLE_CLIENT_SECRET in the keychain (hidden prompt, or stdin)"
usage = 'arg "<key>" help="GOOGLE_CLIENT_ID or GOOGLE_CLIENT_SECRET"'
depends = ["google-mcp:build"]
run = 'google-mcp secret "{{usage.key}}"'

["google-mcp:console"]
description = "Open the Google Cloud OAuth screens (Branding, Audience, client) and print the exact values to enter"
depends = ["google-mcp:build"]
run = 'google-mcp console'

["google-mcp:rotate"]
description = "Rotate the OAuth client secret: you Add secret + copy it in the console; this stores, proves and cleans up"
depends = ["google-mcp:build"]
run = 'google-mcp rotate'

["google-mcp:auth"]
description = "Sign a Google account in to the Google MCP server (opens the browser), then google-mcp:check"
depends = ["google-mcp:build"]
run = 'google-mcp auth'

["google-mcp:check"]
description = "Prove the Google MCP setup end to end: token refresh at Google (client id + secret) and a real Calendar call"
depends = ["google-mcp:build"]
run = 'google-mcp check'

["google-mcp:setup"]
description = "The whole setup on a new machine: the OAuth client into the keychain (only what's missing), a Google account signed in, then google-mcp:check"
depends = ["google-mcp:build"]
run = 'google-mcp setup'

["google-mcp:status"]
description = "Each part of the setup, there or not: the server binary, the keychain's client id and secret, the accounts, .mcp.json"
depends = ["google-mcp:build"]
run = 'google-mcp status'

["google-mcp:credentials"]
description = "GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET into the keychain, prompting only for whichever is missing"
depends = ["google-mcp:build"]
run = 'google-mcp credentials'

["google-mcp:accounts"]
description = "The Google accounts signed in to the MCP server (~/.google-mcp-accounts)"
depends = ["google-mcp:build"]
run = 'google-mcp accounts'

["google-mcp:reset"]
description = "Every Google account signed out (~/.google-mcp-accounts removed); without --yes, only what it would remove"
usage = 'flag "--yes" help="Really remove them"'
depends = ["google-mcp:build"]
run = 'google-mcp reset{% if usage.yes %} --yes{% endif %}'

# The Google Cloud project's APIs (Gmail, Calendar, Drive, …), enabled by Terraform in terraform/google-mcp. Its
# credentials: mise run google:auth login (application-default credentials, no gcloud). Its variables:
# terraform.tfvars (from terraform.tfvars.example: the project id).

["google-mcp:tf-init"]
description = "Terraform initialized (its providers) for the Google Cloud project's APIs (terraform/google-mcp)"
depends = ["google-mcp:build"]
run = 'google-mcp tf-init'

["google-mcp:tf-plan"]
description = "What Terraform would change in the Google Cloud project's APIs (terraform/google-mcp; terraform.tfvars has the project id), after renewing its sign-in if it has expired"
depends = ["google-mcp:build"]
run = 'google-mcp tf-plan'

["google-mcp:tf-apply"]
description = "The Google Cloud project's APIs enabled as Terraform says, after renewing its sign-in if it has expired (arguments passed to terraform: -auto-approve)"
depends = ["google-mcp:build"]
run = 'google-mcp tf-apply'

["google-mcp:tf-destroy"]
description = "The Terraform-managed API enablement removed"
depends = ["google-mcp:build"]
run = 'google-mcp tf-destroy'
