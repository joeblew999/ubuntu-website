# tasks/secrets.toml — secrets:* (PROJECT additions): migrate this repo's .env
# into the fnox keychain. Complements the shared secrets:* / fnox:* tasks from
# joeblew999/.github (fnox:init, secrets:status, secrets:migrate-to-keychain),
# which use the OS keychain provider (macOS Keychain on the Mac).

# ── secrets:import-env ───────────────────────────────────────────────────────
# One-shot: read each KEY=VALUE from .env and store it in the fnox keychain.
# Run AFTER `mise run fnox:init`. Idempotent-ish: re-running overwrites values.
["secrets:import-env"]
description = "Import this repo's .env keys into the fnox keychain (run after fnox:init)"
run = '''
#!/usr/bin/env nu

def main [] {
  let envfile = ".env"
  if not ($envfile | path exists) {
    print --stderr "✗ no .env file found in repo root"
    exit 1
  }

  let entries = (
    open --raw $envfile
    | lines
    | where { |l| (($l | str trim) | str length) > 0 and not (($l | str trim) | str starts-with "#") }
    | parse --regex '^\s*(?:export\s+)?(?<key>[A-Za-z_][A-Za-z0-9_]*)\s*=\s*(?<val>.*)$'
  )

  if ($entries | is-empty) {
    print "no KEY=VALUE entries found in .env"
    return
  }

  for e in $entries {
    let key = ($e.key | str trim)
    let val = ($e.val | str trim | str trim --char '"' | str trim --char "'")
    if ($val | is-empty) {
      print $"·  skip ($key) (empty value)"
      continue
    }
    print $"→  fnox set keychain ($key)"
    $val | ^fnox set --global -p keychain $key
  }

  print ""
  print "✓ done. Verify with:  fnox list   (or:  mise run secrets:status)"
  print "Then enable the [plugins] fnox-env block in mise.toml and remove .env."
}
'''

# ── secrets:required ─────────────────────────────────────────────────────────
# List the secrets this repo expects, and whether each is currently in fnox.
# Read-only; safe to run anytime.
["secrets:required"]
description = "List the secrets this repo needs and whether each is present in fnox"
run = '''
#!/usr/bin/env nu

def main [] {
  let required = [
    "CLOUDFLARE_API_TOKEN"   # cfanalytics, cf-pages, r2, workers, wrangler
    "MAILERLITE_API_KEY"     # mailerlite
    "DEEPL_API_KEY"          # autotranslate (deepl provider)
    "BLUESKY_APP_PASSWORD"   # bluesky syndication (also a GitHub Actions secret)
  ]
  let have = (try { ^fnox list | lines | str trim } catch { [] })
  for k in $required {
    if ($have | any { |h| $h | str contains $k }) {
      print $"✓ ($k)"
    } else {
      print $"✗ ($k)  -- not in fnox (add: fnox set --global -p keychain ($k))"
    }
  }
}
'''
