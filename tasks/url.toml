# ── url:commit ───────────────────────────────────────────────────────────────
["url:commit"]
description = "Open commit preview URL in browser"
run = '''
#!/usr/bin/env nu

def open-url [url: string] {
  try { ^open $url } catch { ^xdg-open $url }
}

def main [] {
  let commit = (^git rev-parse --short HEAD | str trim)
  open-url $"https://($commit).ubuntu-website.pages.dev"
}
'''

