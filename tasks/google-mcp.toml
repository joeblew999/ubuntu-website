# ── google-mcp:credentials ───────────────────────────────────────────────────
["google-mcp:credentials"]
description = "Save Google OAuth credentials to .env (CLIENT_ID, CLIENT_SECRET)"
run = '''
#!/usr/bin/env nu

def main [client_id?: string, client_secret?: string] {
  let env_file = $"($env.PWD)/.env"
  let cid = ($client_id | default "")
  let csecret = ($client_secret | default "")

  print "=== Google OAuth Credentials ==="
  print ""

  # Check if arguments provided
  if ($cid | is-empty) or ($csecret | is-empty) {
    # Show current status
    let env_cid = ($env.GOOGLE_CLIENT_ID? | default "")
    if ($env_cid | is-not-empty) {
      print "Current credentials in environment:"
      print $"  GOOGLE_CLIENT_ID: ($env_cid | str substring 0..30)..."
      print ""
    } else if (($env_file | path exists) and ((open --raw $env_file) | str contains "GOOGLE_CLIENT_ID=")) {
      print "Credentials found in .env file"
      print "GOOGLE_CLIENT_ID=***"
      print ""
    } else {
      print "No credentials configured"
      print ""
    }
    print "To set credentials, run:"
    print "  task google-mcp:credentials CLIENT_ID='your-id' CLIENT_SECRET='your-secret'"
    print ""
    print "Get credentials from:"
    print "  https://console.cloud.google.com/apis/credentials"
    exit 0
  }

  # Create .env if it doesn't exist
  touch $env_file

  # Remove old entries if they exist, then append new credentials
  let existing = (open --raw $env_file | lines | where { |l| not (($l | str starts-with "GOOGLE_CLIENT_ID=") or ($l | str starts-with "GOOGLE_CLIENT_SECRET=")) })
  let updated = ($existing | append ["" "# Google MCP OAuth credentials" $"GOOGLE_CLIENT_ID='($cid)'" $"GOOGLE_CLIENT_SECRET='($csecret)'"])
  $updated | str join "\n" | save --force $env_file

  print "✅ Credentials saved to .env"
  print ""
  print "Next steps:"
  print "  1. Source the .env file: source .env"
  print "  2. Run authentication: task google-mcp:auth"
}
'''

# ── google-mcp:auth ──────────────────────────────────────────────────────────
["google-mcp:auth"]
description = "Authenticate with Google (uses google-mcp-server)"
run = '''
#!/usr/bin/env nu

def main [] {
  let bin = $"($env.PWD)/.build/google-mcp-server"
  if (which google-mcp-server | is-empty) and (not ($bin | path exists)) {
    print --stderr "Google MCP Server not installed."
    print --stderr "Run: task google-mcp:install"
    exit 1
  }

  # Check for credentials
  if (($env.GOOGLE_CLIENT_ID? | default "" | is-empty)) or (($env.GOOGLE_CLIENT_SECRET? | default "" | is-empty)) {
    print "❌ Google credentials not set"
    print ""
    print "Run: task google-mcp:credentials"
    print "Or set environment variables:"
    print "  export GOOGLE_CLIENT_ID='your-client-id'"
    print "  export GOOGLE_CLIENT_SECRET='your-client-secret'"
    exit 1
  }

  print "Starting Google OAuth authentication..."
  print ""
  print "Using credentials from environment"
  print "A browser window will open for Google sign-in."
  print ""
  ^google-mcp-server
}
'''

