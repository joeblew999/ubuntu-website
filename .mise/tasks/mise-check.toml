# This repo's pins and mise tasks, with mise-check. Start with: mise run mise-check (what's done, and what to run next).
# One task per command: mise run mise-check:<command> runs mise-check <command>.
# Each passes its usage values with mise's own templates ({{usage.<name>}}), never shell syntax, so it runs the same
# under sh, cmd and PowerShell.
# Written by mise-check (github.com/joeblew999/mise-check): don't edit it. .mise/config.toml pins its version.

["mise-check"]
description = "what's done for the repo, and what to run next"
usage = 'flag "--json" help="one JSON document on stdout, instead of text"'
run = 'mise-check{% if usage.json %} --json{% endif %}'

["mise-check:init"]
description = "writes mise-check's files again: its tasks, the workflow, the skill, the docs, the hook"
run = "mise-check init"

["mise-check:check"]
description = "the repo's rules: its mise files by misecheck, its skills against their tasks, its README's opening, mise-check's files current, its two pins (the binary in mise, the packages in go.mod) at one release"
usage = 'flag "--json" help="one JSON document on stdout, instead of text"'
run = 'mise-check check{% if usage.json %} --json{% endif %}'

["mise-check:show"]
description = "the same as mise run mise-check"
usage = 'flag "--json" help="one JSON document on stdout, instead of text"'
run = 'mise-check show{% if usage.json %} --json{% endif %}'

["mise-check:verify"]
description = "what GitHub runs: each pin consistent with what pins it, the repo's setup and test, then check"
run = "mise-check verify"

["mise-check:update"]
description = "every pin at its newest: the three below, in order, then mise-check's two pins at one release"
usage = 'flag "--no-major" help="no major moves: packages within their ranges, Go modules within their major"; flag "--json" help="one JSON document on stdout, every pin before and after, instead of text"'
run = 'mise-check update{% if usage.no_major %} --no-major{% endif %}{% if usage.json %} --json{% endif %}'

["mise-check:update-mise"]
description = "the tools in the repo's mise files"
usage = 'flag "--no-major" help="no major moves: packages within their ranges, Go modules within their major"; flag "--json" help="one JSON document on stdout, every pin before and after, instead of text"'
run = 'mise-check update-mise{% if usage.no_major %} --no-major{% endif %}{% if usage.json %} --json{% endif %}'

["mise-check:update-packages"]
description = "package.json and its lockfile, through aube"
usage = 'flag "--no-major" help="no major moves: packages within their ranges, Go modules within their major"; flag "--json" help="one JSON document on stdout, every pin before and after, instead of text"'
run = 'mise-check update-packages{% if usage.no_major %} --no-major{% endif %}{% if usage.json %} --json{% endif %}'

["mise-check:update-go"]
description = "every go.mod's toolchain line and modules, majors too, their import paths rewritten"
usage = 'flag "--no-major" help="no major moves: packages within their ranges, Go modules within their major"; flag "--json" help="one JSON document on stdout, every pin before and after, instead of text"'
run = 'mise-check update-go{% if usage.no_major %} --no-major{% endif %}{% if usage.json %} --json{% endif %}'

["mise-check:show-users"]
description = "which of the owner's repos use it, at what version, the behind ones marked"
usage = 'flag "--json" help="one JSON document on stdout, instead of text"'
run = 'mise-check show-users{% if usage.json %} --json{% endif %}'

["mise-check:template"]
description = "the template's little app, its go.mod and packages; it never writes over a file"
run = "mise-check template"

["mise-check:new-tool"]
description = "a new mise tool repo in an empty folder: mise-check at its release, copied and renamed for the module, its packages imported instead"
usage = 'arg "<module>" help="the new repo, github.com/<owner>/<name>: mise-check is renamed <name> in it"; flag "--from <folder>" help="copy this checkout of mise-check instead of its release"'
run = 'mise-check new-tool{% if usage.from %} --from "{{usage.from}}"{% endif %} "{{usage.module}}"'

["mise-check:show-version"]
description = "its version"
usage = 'flag "--json" help="one JSON document on stdout, instead of text"'
run = 'mise-check show-version{% if usage.json %} --json{% endif %}'

["mise-check:show-help"]
description = "every command and its flags"
run = "mise-check show-help"
