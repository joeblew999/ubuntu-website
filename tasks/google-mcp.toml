# ── google-mcp:tf:check:deps ─────────────────────────────────────────────────
["google-mcp:tf:check:deps"]
description = "Check Terraform dependencies (terraform, gcloud)"
run = '''
#!/usr/bin/env nu

def main [] {
  print "Checking Terraform dependencies..."
  mut missing = 0

  # Check terraform
  if (which terraform | is-not-empty) {
    let v = (try { ^terraform version | lines | first } catch { "" })
    print $"✅ terraform: ($v)"
  } else {
    print "❌ terraform: not installed"
    print "   Install: brew install terraform"
    $missing = 1
  }

  # Check gcloud
  if (which gcloud | is-not-empty) {
    print "✅ gcloud: installed"
  } else {
    print "❌ gcloud: not installed"
    print "   Install: brew install --cask google-cloud-sdk"
    $missing = 1
  }

  # Check gcloud auth
  let authed = (do { ^gcloud auth application-default print-access-token } | complete | get exit_code) == 0
  if $authed {
    print "✅ gcloud auth: authenticated"
  } else {
    print "❌ gcloud auth: not authenticated"
    print "   Run: gcloud auth application-default login"
    $missing = 1
  }

  if $missing == 1 {
    exit 1
  }
}
'''

