# tasks/playwright.toml — playwright:* namespace: browser automation tool. Ported from taskfiles/Taskfile.playwright.yml.

# ── playwright:install ───────────────────────────────────────────────────────
["playwright:install"]
description = "Install Playwright browsers (chromium)"
run = '''
#!/usr/bin/env nu

def main [] {
  ^go run ./cmd/playwright install
}
'''

# ── playwright:oauth ─────────────────────────────────────────────────────────
["playwright:oauth"]
description = "Start OAuth flow with callback server (url, port=8085, timeout=120, headless)"
run = '''
#!/usr/bin/env nu

def main [url: string, port: string = "8085", timeout: string = "120", headless?: string] {
  mut flags = []
  if (($headless | default "") | is-not-empty) { $flags = ($flags | append "-headless") }
  $flags = ($flags | append [$"-port=($port)" $"-timeout=($timeout)"])
  ^go run ./cmd/playwright ...$flags oauth $url
}
'''

# ── playwright:open ──────────────────────────────────────────────────────────
["playwright:open"]
description = "Open URL in Playwright browser (url, timeout=120, headless)"
run = '''
#!/usr/bin/env nu

def main [url: string, timeout: string = "120", headless?: string] {
  mut flags = []
  if (($headless | default "") | is-not-empty) { $flags = ($flags | append "-headless") }
  $flags = ($flags | append $"-timeout=($timeout)")
  ^go run ./cmd/playwright ...$flags open $url
}
'''

# ── playwright:screenshot ────────────────────────────────────────────────────
["playwright:screenshot"]
description = "Take a screenshot of a URL (url, file output)"
run = '''
#!/usr/bin/env nu

def main [url: string, file: string] {
  ^go run ./cmd/playwright screenshot $url $file
}
'''

# ── playwright:build ─────────────────────────────────────────────────────────
["playwright:build"]
description = "Build the playwright binary into BIN_INSTALL_DIR"
run = '''
#!/usr/bin/env nu

def main [] {
  let dir = ($env.BIN_INSTALL_DIR? | default ".bin")
  mkdir $dir
  ^go build -o $"($dir)/playwright" ./cmd/playwright
}
'''

# ── playwright:example:google-oauth ──────────────────────────────────────────
["playwright:example:google-oauth"]
description = "Example: explain the Google OAuth flow using the oauth command"
run = '''
#!/usr/bin/env nu

def main [] {
  print "Playwright OAuth Example - Google"
  print ""
  print "In a real implementation, you would:"
  print "  1. Generate PKCE code_verifier and code_challenge"
  print "  2. Build the OAuth URL with your client_id and scopes"
  print "  3. Call: mise run playwright:oauth <your-oauth-url>"
  print "  4. Parse the JSON output to get the authorization code"
  print "  5. Exchange the code for tokens via POST to token endpoint"
  print ""
  print "See: cmd/google-auth/main.go for a working implementation"
}
'''

