# tasks/google.toml — google:* namespace: unified CLI for all Google services (auth, calendar, gmail, drive, sheets, docs, slides). Ported from taskfiles/Taskfile.google.yml.

# ── google:default ───────────────────────────────────────────────────────────
["google:default"]
description = "Show unified Google CLI status and help"
run = '''
#!/usr/bin/env nu

def main [] {
  ^go run ./cmd/google
}
'''

# ── google:check ─────────────────────────────────────────────────────────────
["google:check"]
description = "Verify Google CLI is built and working"
run = '''
#!/usr/bin/env nu

def main [] {
  print "Google CLI ready (run via: go run ./cmd/google)"
  let out = (^go run ./cmd/google | complete | get stdout)
  $out | lines | first 5 | each { |l| print $l }
}
'''

