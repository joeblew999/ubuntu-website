# ── toki:md:generate ─────────────────────────────────────────────────────────
["toki:md:generate"]
description = "Generate ARB catalogs from English markdown (de, zh, ja)"
depends = ["toki:build"]
run = '''
#!/usr/bin/env nu

def main [] {
  let dir = ($env.BIN_INSTALL_DIR? | default ".bin")
  let bin = ($dir | path expand | path join "toki")
  let content = ($env.ROOT_DIR? | default "." | path join "content")
  ^$bin generate -l en -md ($content | path join "english") -md-only -t de -t zh -t ja -v
}
'''

# ── toki:md:status ───────────────────────────────────────────────────────────
["toki:md:status"]
description = "Show ARB completeness stats"
run = '''
#!/usr/bin/env nu

def main [] {
  let bundle = ($env.ROOT_DIR? | default "." | path join "tokibundle")
  print "=== Toki ARB Catalogs ==="
  if not ($bundle | path exists) {
    print "No tokibundle directory. Run: mise run toki:md:generate"
    return
  }
  let files = (glob ($bundle | path join "catalog_*.arb"))
  if ($files | is-empty) {
    print "No catalog_*.arb files found."
    return
  }
  for f in $files {
    let locale = ($f | path basename | str replace ".arb" "" | str replace "catalog_" "")
    let text = (open --raw $f | decode utf-8)
    let count = ($text | lines | where {|l| $l =~ '"msg' } | length)
    let empty = ($text | lines | where {|l| $l =~ '": ""' } | length)
    print $"($locale): ($count) messages, ($empty) empty"
  }
}
'''

