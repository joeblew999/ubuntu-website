# tasks/cf.toml — cf-pages:* namespace: Cloudflare Pages project deploy/status/open. Ported from taskfiles/Taskfile.cf.yml.
#
# NOTE: prefixed `cf-pages:` to AVOID clashing with the shared `cf:*` primitives
# (tool-cf.toml from joeblew999/.github). Generic CF primitives are NOT recreated here.
# Project literals: PROJECT_NAME=ubuntu-website, DOMAIN=www.ubuntusoftware.net,
# URL_PRODUCTION=https://www.ubuntusoftware.net, URL_PREVIEW=https://ubuntu-website.pages.dev.
# CF_ACCOUNT_ID / CF_ZONE_ID come from $env (set in mise.toml).

# ── cf-pages:check:validate ──────────────────────────────────────────────────
["cf-pages:check:validate"]
description = "Validate wrangler can access Cloudflare"
tools = { wrangler = "latest" }
run = '''
#!/usr/bin/env nu

def main [] {
  let r = (^wrangler pages project list --json | complete)
  if $r.exit_code == 0 {
    print "OK: wrangler can access Cloudflare"
  } else {
    print "WARN: Could not validate Cloudflare access (may need login)"
  }
}
'''

# ── cf-pages:status ──────────────────────────────────────────────────────────
["cf-pages:status"]
description = "Check Cloudflare Pages deployment status"
tools = { wrangler = "latest" }
run = '''
#!/usr/bin/env nu

def main [] {
  let acct = ($env.CF_ACCOUNT_ID? | default "")
  print "========================================"
  print "Cloudflare Pages Status"
  print "========================================"
  print "Project: ubuntu-website"
  print ""
  print "URLs:"
  print "  Production: https://www.ubuntusoftware.net"
  print "  Preview: https://ubuntu-website.pages.dev"
  print ""
  print "Dashboards:"
  print $"  Pages: https://dash.cloudflare.com/($acct)/pages/view/ubuntu-website"
  print $"  Settings: https://dash.cloudflare.com/($acct)/pages/view/ubuntu-website/settings/production"
  print ""
  print "Recent Deployments:"
  print "========================================"
  ^wrangler pages deployment list --project-name=ubuntu-website
}
'''

