# tasks/google-mcp.toml — google-mcp:* namespace: external google-mcp-server setup (install, OAuth, auth, claude config, status). Ported from taskfiles/tools/Taskfile.google-mcp.yml.

# ── google-mcp:default ───────────────────────────────────────────────────────
["google-mcp:default"]
description = "Show Google MCP status"
depends = ["google-mcp:status"]

# ── google-mcp:status ────────────────────────────────────────────────────────
["google-mcp:status"]
description = "Check Google MCP configuration status"
run = '''
#!/usr/bin/env nu

def main [] {
  let bin = $"($env.PWD)/.build/google-mcp-server"
  let accounts_dir = $"($env.HOME)/.google-mcp-accounts"

  print "=== Google MCP Server Status ==="
  print ""

  # Check binary
  if (which google-mcp-server | is-not-empty) {
    let path = (which google-mcp-server | get 0.path)
    print $"✅ Binary: ($path)"
    try { ^google-mcp-server --version } catch { print "   (version check not supported)" }
  } else if ($bin | path exists) {
    print $"✅ Binary: ($bin)"
  } else {
    print "❌ Binary: NOT INSTALLED"
    print "   Run: task google-mcp:install"
  }

  # Check accounts
  if ($accounts_dir | path exists) {
    let accounts = (try { ls $"($accounts_dir)/*.json" | get name } catch { [] })
    if ($accounts | length) > 0 {
      print $"✅ Accounts: ($accounts | length) authenticated"
      $accounts | each { |a| print $"   - (($a | path basename) | str replace '.json' '')" }
    } else {
      print "❌ Accounts: None authenticated"
      print "   Run: task google-mcp:auth"
    }
  } else {
    print $"❌ Accounts: ($accounts_dir) not found"
  }

  # Check .vscode/mcp.json (VSCode location)
  if (".vscode/mcp.json" | path exists) {
    let content = (open --raw ".vscode/mcp.json")
    if ($content | str contains '"google"') {
      print "✅ VSCode: .vscode/mcp.json has google server"
    } else {
      print "⚠️  VSCode: .vscode/mcp.json exists but no google server"
      print "   Run: task google-mcp:claude:add"
    }
  } else {
    print "❌ VSCode: No .vscode/mcp.json found"
    print "   Run: task google-mcp:claude:add"
  }

  print ""
}
'''

# ── google-mcp:install ───────────────────────────────────────────────────────
["google-mcp:install"]
description = "Install Google MCP Server via go install"
run = '''
#!/usr/bin/env nu

def main [] {
  let module = "go.ngs.io/google-mcp-server"
  let gobin = $"($env.PWD)/.build"
  let bin = $"($gobin)/google-mcp-server"

  mkdir $gobin
  print "Installing Google MCP Server..."
  print $"Module: ($module)"
  print $"Target: ($bin)"
  print ""
  GOPROXY=direct GOBIN=$gobin ^go install $"($module)@latest"
  print ""
  print $"✅ Installed to ($bin)"
}
'''

# ── google-mcp:src:clone ─────────────────────────────────────────────────────
["google-mcp:src:clone"]
description = "Clone the google-mcp-server fork for development"
run = '''
#!/usr/bin/env nu

def main [] {
  let fork = "github.com/joeblew999/google-mcp-server"
  let src_dir = ($env.SRC_DIR? | default $"($env.HOME)/src")
  let src = $"($src_dir)/google-mcp-server"

  if ($"($src)/.git" | path exists) {
    print $"✅ Already cloned to ($src)"
    return
  }

  mkdir $src_dir
  ^git clone $"https://($fork).git" $src
  cd $src
  ^git remote add upstream "https://github.com/ngs/google-mcp-server.git"
  print $"✅ Cloned to ($src)"
  print "   Upstream remote added: ngs/google-mcp-server"
  print ""
  print "To install from local source:"
  print "   task google-mcp:src:install"
}
'''

# ── google-mcp:src:sync ──────────────────────────────────────────────────────
["google-mcp:src:sync"]
description = "Sync fork with upstream (fetch + rebase)"
run = '''
#!/usr/bin/env nu

def main [] {
  let src_dir = ($env.SRC_DIR? | default $"($env.HOME)/src")
  let src = $"($src_dir)/google-mcp-server"

  if not ($"($src)/.git" | path exists) {
    print --stderr "Fork not cloned. Run: task google-mcp:src:clone"
    exit 1
  }

  cd $src
  ^git fetch upstream
  ^git rebase upstream/master
  print "✅ Synced with upstream"
  print ""
  print "To push changes to your fork:"
  print $"  cd ($src) && git push origin master"
}
'''

# ── google-mcp:src:install ───────────────────────────────────────────────────
["google-mcp:src:install"]
description = "Install from local source (for development)"
run = '''
#!/usr/bin/env nu

def main [] {
  let src_dir = ($env.SRC_DIR? | default $"($env.HOME)/src")
  let src = $"($src_dir)/google-mcp-server"
  let gobin = $"($env.PWD)/.build"
  let bin = $"($gobin)/google-mcp-server"

  if not ($"($src)/.git" | path exists) {
    print --stderr "Fork not cloned. Run: task google-mcp:src:clone"
    exit 1
  }

  mkdir $gobin
  print "Installing from local source..."
  print $"Source: ($src)"
  print $"Target: ($bin)"
  print ""
  cd $src
  # GOWORK=off prevents go.work from interfering with module resolution
  GOWORK=off GOBIN=$gobin ^go install .
  print ""
  print $"✅ Installed from local source to ($bin)"
}
'''

