# tasks/url.toml — url:* namespace: browser-open shortcuts / SEO dashboards. Ported from taskfiles/Taskfile.url.yml.

# ── url:dev ──────────────────────────────────────────────────────────────────
["url:dev"]
description = "Open local development server in browser"
run = '''
#!/usr/bin/env nu

def open-url [url: string] {
  try { ^open $url } catch { ^xdg-open $url }
}

def main [] {
  open-url "http://localhost:1313"
}
'''

