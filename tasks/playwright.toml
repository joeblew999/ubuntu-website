["playwright:gmail:sendas:smtp2go"]
description = "Configure Gmail Send mail as with SMTP2GO (name, email, user, pass)"
run = '''
#!/usr/bin/env nu

def main [name: string, email: string, user?: string, pass?: string] {
  let u = (($user | default "") | default ($env.SMTP2GO_USERNAME? | default "ubuntusoftware.net"))
