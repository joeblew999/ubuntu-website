# Cloudflare beyond the site's Worker (whose login, deploys and previews are mise-cloudflare's: mise run cloudflare): the
# zone's cache and Email Routing, with Cloudflare's own CLI, cf (pinned in mise.toml), on its own login (cf:login, once;
# no token in .env). A forward is added once in a while, so it's cf's own command, not a task:
#   cf email-routing rules create --zone 867fb5996096b895b47114b6564ee0fb --name "Forward <from>" \
#     --matchers '[{"type":"literal","field":"to","value":"<from>"}]' --actions '[{"type":"forward","value":["<to>"]}]'

["cf:login"]
description = "cf's own login (opens the browser): once per machine"
run = 'cf auth login'

["cf:purge"]
description = "Everything in the CDN cache for ubuntusoftware.net purged"
run = 'cf cache purge --zone 867fb5996096b895b47114b6564ee0fb --body @cloudflare/purge-everything.json --force'

["cf:email-status"]
description = "Email Routing for ubuntusoftware.net: its settings, its rules (from → to), its destination addresses"
run = 'cf email-routing settings get --zone 867fb5996096b895b47114b6564ee0fb && cf email-routing rules list-account --zone 867fb5996096b895b47114b6564ee0fb && cf email-routing addresses list'

["cf:email-remove"]
description = "An Email Routing rule removed, by its id (cf:email-status lists them)"
usage = 'arg "<rule-id>" help="The rule id"'
run = 'cf email-routing rules delete "{{usage.rule_id}}" --zone 867fb5996096b895b47114b6564ee0fb --force'
