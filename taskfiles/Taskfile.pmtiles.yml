# PMTiles server for local development
# Hugo's dev server doesn't handle HTTP range requests properly,
# which PMTiles requires. This server runs alongside Hugo.

version: "3"

tasks:
  server:
    desc: Start local PMTiles server (for dev alongside Hugo)
    summary: |
      Starts a PMTiles server on port 8765 that properly handles
      HTTP range requests. Run this alongside Hugo for local airspace
      demo development.

      Hugo's dev server doesn't properly handle concurrent range requests,
      causing PMTiles loading to fail. This server provides the correct
      range request handling with CORS support.

      The airspace-demo page automatically detects if this server is running
      and uses it instead of R2 for local development.
    dir: "{{.ROOT_DIR}}"
    cmd: go run ./cmd/pmtiles-server -dir static/airspace/tiles -port {{.PORT | default "8765"}}
    vars:
      PORT: '{{.PORT | default "8765"}}'

  server:build:
    desc: Build pmtiles-server binary
    dir: "{{.ROOT_DIR}}"
    cmd: go build -o bin/pmtiles-server ./cmd/pmtiles-server
    sources:
      - cmd/pmtiles-server/**/*.go
    generates:
      - bin/pmtiles-server

  check:
    desc: Check if pmtiles-server is running
    cmd: |
      if curl -s -o /dev/null -w "%{http_code}" http://localhost:8765/faa_uas_facility_map.pmtiles | grep -q "200\|206"; then
        echo "pmtiles-server is running on :8765"
      else
        echo "pmtiles-server is NOT running"
        echo "Run: task pmtiles:server"
        exit 1
      fi
