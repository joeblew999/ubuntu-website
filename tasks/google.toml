'''

# ── google:calendar:list ─────────────────────────────────────────────────────
["google:calendar:list"]
description = "List upcoming events (MAX optional, default 10)"
run = '''
#!/usr/bin/env nu

def main [max?: string] {
  let m = ($max | default "10")
  ^go run ./cmd/google calendar list $"--max=($m)"
}
'''

# ── google:calendar:list:week ────────────────────────────────────────────────
["google:calendar:list:week"]
description = "List this week's events (next 7 days)"
run = '''
#!/usr/bin/env nu

def main [] {
  let end = ((date now) + 7day | format date "%Y-%m-%dT23:59:59%z")
  ^go run ./cmd/google calendar list $"--end=($end)" --max=50
}
'''

# ── google:calendar:create ───────────────────────────────────────────────────
["google:calendar:create"]
description = "Create calendar event (TITLE, START, END required; DESCRIPTION, LOCATION, ATTENDEES optional)"
run = '''
#!/usr/bin/env nu

def main [title: string, start: string, end: string, description?: string, location?: string, attendees?: string] {
  mut args = [calendar create $"--title=($title)" $"--start=($start)" $"--end=($end)"]
  if not ($description | is-empty) { $args = ($args | append $"--description=($description)") }
  if not ($location | is-empty) { $args = ($args | append $"--location=($location)") }
  if not ($attendees | is-empty) { $args = ($args | append $"--attendees=($attendees)") }
  ^go run ./cmd/google ...$args
}
'''

# ── google:calendar:compose ──────────────────────────────────────────────────
["google:calendar:compose"]
description = "Open calendar to create event (TITLE, START, END required; DESCRIPTION, LOCATION optional)"
run = '''
#!/usr/bin/env nu

def main [title: string, start: string, end: string, description?: string, location?: string] {
  mut args = [calendar compose $"--title=($title)" $"--start=($start)" $"--end=($end)"]
  if not ($description | is-empty) { $args = ($args | append $"--description=($description)") }
  if not ($location | is-empty) { $args = ($args | append $"--location=($location)") }
  ^go run ./cmd/google ...$args
}
'''

