# mise-cloudflare for this repo, from its GitHub releases: mise install gets it, and mise-check, which cloudflare:update
# runs. mise-cloudflare init writes this file when the repo has none, pinning exactly the release that ran it (here in
# the template it's latest), and adds its parts (its pin, its settings below) and mise-check's pin to one that lacks
# them; from then on the pins are the repo's (mise run cloudflare:update moves them). A .mise/config.local.toml beside
# it, never committed, overrides it on one machine: mise-cloudflare's own checkout pins its build there (local).

[settings]
# The tools this repo takes the minute a release is out, never held back a day as every other tool's are
# (minimum_release_age): latest is their newest release, and mise-check:update clears their cached release lists
# first. Each tool's init adds its own name here, beside the others'.
minimum_release_age_excludes = ["github:joeblew999/mise-check", "github:joeblew999/mise-cloudflare"]
# A latest from GitHub's own list of releases, not mise's versions host, which lists a release some time after it's
# out: latest is the newest the minute it's there (an exact pin lists none). Each tool's init adds this too.
use_versions_host = false

[tools]
"github:joeblew999/mise-check" = "0.4.34"
"github:joeblew999/mise-cloudflare" = "0.1.51"
