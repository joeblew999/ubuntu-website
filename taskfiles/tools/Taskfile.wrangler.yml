# Wrangler - Cloudflare CLI Taskfile
#
# Wrangler is pinned in mise.toml (npm:wrangler) and called by name (WRANGLER_CMD).
# Used by cf.yml for Cloudflare Pages deployments, secrets, and cache purging,
# and by workers.yml for Cloudflare Workers.

version: '3'

tasks:
  # ===========================================================================
  # Checks
  # ===========================================================================

  check:deps:
    desc: Ensure the mise-pinned wrangler CLI is installed
    status:
      - command -v {{.WRANGLER_CMD}}
    cmds:
      - mise install npm:wrangler

  check:validate:
    desc: Validate wrangler CLI works
    deps: [check:deps]
    cmds:
      - |
        VERSION=$({{.WRANGLER_CMD}} --version 2>/dev/null | head -1)
        echo "OK: wrangler $VERSION"

  # ===========================================================================
  # Version Management
  # ===========================================================================

  version:
    desc: Show installed wrangler version
    deps: [check:deps]
    cmds:
      - '{{.WRANGLER_CMD}} --version'

  upgrade:
    desc: Upgrade wrangler to latest version (re-pins it in mise.toml)
    cmds:
      - mise use --pin --path "{{.ROOT_DIR}}/mise.toml" npm:wrangler@latest
      - '{{.WRANGLER_CMD}} --version'
      - 'echo "OK: wrangler upgraded; commit mise.toml"'
