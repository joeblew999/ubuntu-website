# FAA Airspace Data Sync Workflow
#
# Syncs FAA airspace data from ArcGIS to Cloudflare R2: only the datasets whose FAA version (their layer's
# dataLastEditDate) isn't the one the manifest in R2 records, so most weeks it stops after a few small requests.
# Nothing is cached between runs: what's published is read from R2 itself. The rules: internal/airspace/doc.go.
# Uses pure Go tiler (gotiler) - no external dependencies like tippecanoe.
#
# Schedule: Weekly on Thursday (aligned with AIRAC cycle midpoint)
# Manual: workflow_dispatch for on-demand sync
#
# R2 Upload requires CLOUDFLARE_API_TOKEN secret with R2 permissions.

name: "[Sync] Airspace Data"

on:
  schedule:
    # Run weekly on Thursday at 06:00 UTC
    # AIRAC cycles are every 28 days; Thursday midweek catches most updates
    - cron: '0 6 * * 4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-download all data'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.15
          cache: true

      - name: Run pipeline
        id: pipeline
        run: |
          # mise run airspace:pipeline: sync → tile → manifest, only the datasets the FAA changed since R2's manifest,
          # with the Go tiler (no tippecanoe needed); a dataset that fails to download fails the run
          mise run airspace:pipeline --tiler gotiler ${{ inputs.force == 'true' && '--force' || '' }}

      - name: Check for changes
        id: check_changes
        run: mise run airspace:check >> "$GITHUB_OUTPUT"

      - name: Upload to R2
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: mise run airspace:upload

      - name: Skip notification
        if: steps.check_changes.outputs.has_changes != 'true'
        run: echo "No changes detected - pipeline skipped tile/manifest/upload (idempotent)"

      - name: Summary
        run: mise run airspace:summary
