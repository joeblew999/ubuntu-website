# ── cf-pages:email:status ────────────────────────────────────────────────────
["cf-pages:email:status"]
description = "Check Email Routing status and list rules/destinations"
run = '''
#!/usr/bin/env nu

def main [] {
  let token = ($env.CLOUDFLARE_API_TOKEN? | default "")
  if ($token | is-empty) {
    print --stderr "ERROR: CLOUDFLARE_API_TOKEN must be set in env"
    exit 1
  }
  let zone = ($env.CF_ZONE_ID? | default "")
  let acct = ($env.CF_ACCOUNT_ID? | default "")
  print "========================================"
  print "Email Routing Status for www.ubuntusoftware.net"
  print "========================================"
  print ""

  let settings = (^curl -s $"https://api.cloudflare.com/client/v4/zones/($zone)/email/routing"
    -H $"Authorization: Bearer ($token)" -H "Content-Type: application/json")
  let enabled = (try { $settings | from json | get result.enabled } catch { "unknown" })
  print $"Email Routing: ($enabled)"
  print ""

  print "Routing Rules:"
  print "----------------------------------------"
  let rules = (^curl -s $"https://api.cloudflare.com/client/v4/zones/($zone)/email/routing/rules"
    -H $"Authorization: Bearer ($token)" -H "Content-Type: application/json")
  try {
    $rules | from json | get result | each { |r|
      let m = ($r.matchers.0.value? | default "catch-all")
      let a = ($r.actions.0.value.0? | default "drop")
      let s = (if $r.enabled { "enabled" } else { "disabled" })
      print $"  ($m) -> ($a) [($s)]"
    }
  } catch { print "  No rules configured" }
  print ""

  print "Verified Destinations:"
  print "----------------------------------------"
  let dests = (^curl -s $"https://api.cloudflare.com/client/v4/accounts/($acct)/email/routing/addresses"
    -H $"Authorization: Bearer ($token)" -H "Content-Type: application/json")
  try {
    $dests | from json | get result | each { |d|
      let v = (if $d.verified { "verified" } else { "pending" })
      print $"  ($d.email) [($v)]"
    }
  } catch { print "  No destinations" }
}
'''

# ── cf-pages:email:add ───────────────────────────────────────────────────────
["cf-pages:email:add"]
description = "Add email forwarding rule (FROM TO)"
run = '''
#!/usr/bin/env nu

def main [from: string, to: string] {
  let token = ($env.CLOUDFLARE_API_TOKEN? | default "")
  if ($token | is-empty) {
    print --stderr "ERROR: CLOUDFLARE_API_TOKEN must be set in env"
    exit 1
  }
  let zone = ($env.CF_ZONE_ID? | default "")
  let acct = ($env.CF_ACCOUNT_ID? | default "")

  print "========================================"
  print "Adding Email Routing Rule"
  print "========================================"
  print $"  From: ($from)"
  print $"  To:   ($to)"
  print ""

  print "Checking destination address..."
  let dests = (^curl -s $"https://api.cloudflare.com/client/v4/accounts/($acct)/email/routing/addresses"
    -H $"Authorization: Bearer ($token)" -H "Content-Type: application/json")
  let verified = (try {
    $dests | from json | get result | where email == $to | get verified.0?
  } catch { null })

  if $verified != true {
    print $"Destination ($to) not verified. Adding..."
    let add = (^curl -s -X POST $"https://api.cloudflare.com/client/v4/accounts/($acct)/email/routing/addresses"
      -H $"Authorization: Bearer ($token)" -H "Content-Type: application/json"
      --data $'{"email": "($to)"}')
    let ok = (try { $add | from json | get success } catch { false })
    if $ok {
      print $"Verification email sent to ($to)"
      print "Please verify before continuing."
      exit 0
    } else {
      print "Note: Destination may already exist or require verification"
    }
  } else {
    print $"OK: Destination ($to) is verified"
  }

  print ""
  print "Creating routing rule..."
  let body = $'{"actions": [{"type": "forward", "value": ["($to)"]}], "matchers": [{"type": "literal", "field": "to", "value": "($from)"}], "enabled": true, "name": "Forward ($from) to ($to)"}'
  let resp = (^curl -s -X POST $"https://api.cloudflare.com/client/v4/zones/($zone)/email/routing/rules"
    -H $"Authorization: Bearer ($token)" -H "Content-Type: application/json" --data $body)
  let ok = (try { $resp | from json | get success } catch { false })
  if $ok {
    print "OK: Routing rule created successfully!"
    print ""
    print $"Emails to ($from) will now forward to ($to)"
  } else {
    let err = (try { $resp | from json | get errors.0.message } catch { "Unknown error" })
    print --stderr $"ERROR: ($err)"
    print --stderr $resp
    exit 1
  }
}
'''

# ── cf-pages:email:remove ────────────────────────────────────────────────────
["cf-pages:email:remove"]
description = "Remove email forwarding rule (FROM)"
run = '''
#!/usr/bin/env nu

def main [from: string] {
  let token = ($env.CLOUDFLARE_API_TOKEN? | default "")
  if ($token | is-empty) {
    print --stderr "ERROR: CLOUDFLARE_API_TOKEN must be set in env"
    exit 1
  }
  let zone = ($env.CF_ZONE_ID? | default "")

  print $"Removing routing rule for ($from)..."
  let rules = (^curl -s $"https://api.cloudflare.com/client/v4/zones/($zone)/email/routing/rules"
    -H $"Authorization: Bearer ($token)" -H "Content-Type: application/json")
  let rule_id = (try {
    $rules | from json | get result | where ($it.matchers.0.value? | default "") == $from | get tag.0?
  } catch { null })

  if ($rule_id | is-empty) or ($rule_id == null) {
    print --stderr $"ERROR: No routing rule found for ($from)"
    exit 1
  }

  let resp = (^curl -s -X DELETE $"https://api.cloudflare.com/client/v4/zones/($zone)/email/routing/rules/($rule_id)"
    -H $"Authorization: Bearer ($token)" -H "Content-Type: application/json")
  let ok = (try { $resp | from json | get success } catch { false })
  if $ok {
    print "OK: Routing rule removed"
  } else {
    print --stderr "ERROR: Failed to remove rule"
    print --stderr $resp
    exit 1
  }
}
'''

