# ── r2:cors:set ──────────────────────────────────────────────────────────────
["r2:cors:set"]
description = "Apply CORS rules to R2 bucket (from ./r2-cors.json)"
tools = { wrangler = "latest" }
run = '''
#!/usr/bin/env nu

def main [] {
  ^wrangler r2 bucket cors set ubuntu-website-assets --file ./r2-cors.json --force
  print "CORS rules applied. Test with mise run r2:cors:test"
}
'''

