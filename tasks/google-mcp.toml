# ── google-mcp:tf:setup ──────────────────────────────────────────────────────
["google-mcp:tf:setup"]
description = "Full Terraform setup - install deps, configure, and apply"
run = '''
#!/usr/bin/env nu

def main [] {
  let dir = $"($env.PWD)/terraform/google-mcp"

  print "════════════════════════════════════════════════════════════════"
  print "  TERRAFORM SETUP - Enable Google APIs"
  print "════════════════════════════════════════════════════════════════"
  print ""

  # Step 1: Check/install dependencies
  print "Step 1: Checking dependencies..."
  if (which terraform | is-empty) {
    print "Installing terraform..."
    ^brew install terraform
  }
  print "✅ terraform installed"

  if (which gcloud | is-empty) {
    print "Installing gcloud..."
    ^brew install --cask google-cloud-sdk
  }
  print "✅ gcloud installed"

  # Step 2: Check gcloud auth
  print ""
  print "Step 2: Checking gcloud authentication..."
  let authed = (do { ^gcloud auth application-default print-access-token } | complete | get exit_code) == 0
  if not $authed {
    print ""
    print "You need to authenticate with gcloud."
    print "This will open a browser window."
    print ""
    ^gcloud auth application-default login
  }
  print "✅ gcloud authenticated"

  # Step 3: Configure project
  print ""
  print "Step 3: Configuring project..."
  cd $dir

  if not ("terraform.tfvars" | path exists) {
    print ""
    print "Enter your Google Cloud Project ID:"
    let project_id = (input | str trim)
    if ($project_id | is-empty) {
      print --stderr "❌ Project ID cannot be empty"
      exit 1
    }
    $"project_id = \"($project_id)\"\n" | save --force "terraform.tfvars"
    print "✅ Created terraform.tfvars"
  } else {
    print "✅ terraform.tfvars exists"
    open --raw "terraform.tfvars" | print
  }

  # Step 4: Initialize and apply
  print ""
  print "Step 4: Initializing Terraform..."
  ^terraform init

  print ""
  print "Step 5: Applying (enabling APIs)..."
  ^terraform apply -auto-approve

  print ""
  print "════════════════════════════════════════════════════════════════"
  print "  ✅ SETUP COMPLETE"
  print "════════════════════════════════════════════════════════════════"
  print ""
  ^terraform output
}
'''
