# tasks/toki.toml — toki:* namespace: Go i18n toolkit (fork joeblew999/toki). Ported from taskfiles/Taskfile.toki.yml.

# ── toki:src:clone ───────────────────────────────────────────────────────────
["toki:src:clone"]
description = "Clone toki fork to .src/toki"
run = '''
#!/usr/bin/env nu

def main [] {
  let src = ($env.SRC_DIR? | default ".src" | path join "toki")
  if ($"($src)/.git" | path exists) {
    print $"toki source already present at ($src)"
    return
  }
  mkdir ($src | path dirname)
  ^git clone "https://github.com/joeblew999/toki.git" $src
  try {
    ^git -C $src remote add upstream "https://github.com/romshark/toki.git"
  } catch {
    print --stderr "upstream remote already exists (ignored)"
  }
}
'''

# ── toki:src:update ──────────────────────────────────────────────────────────
["toki:src:update"]
description = "Pull latest from fork (origin)"
run = '''
#!/usr/bin/env nu

def main [] {
  let src = ($env.SRC_DIR? | default ".src" | path join "toki")
  ^git -C $src fetch origin
  ^git -C $src pull origin main
}
'''

# ── toki:src:upstream ────────────────────────────────────────────────────────
["toki:src:upstream"]
description = "Fetch upstream changes (romshark/toki)"
run = '''
#!/usr/bin/env nu

def main [] {
  let src = ($env.SRC_DIR? | default ".src" | path join "toki")
  ^git -C $src fetch upstream
  print ""
  print "Upstream changes fetched. To merge:"
  print $"  git -C ($src) merge upstream/main"
}
'''

# ── toki:src:upstream:merge ──────────────────────────────────────────────────
["toki:src:upstream:merge"]
description = "Merge upstream main into current branch"
run = '''
#!/usr/bin/env nu

def main [] {
  let src = ($env.SRC_DIR? | default ".src" | path join "toki")
  ^git -C $src fetch upstream
  ^git -C $src merge upstream/main
}
'''

# ── toki:src:status ──────────────────────────────────────────────────────────
["toki:src:status"]
description = "Show git status of toki source"
run = '''
#!/usr/bin/env nu

def main [] {
  let src = ($env.SRC_DIR? | default ".src" | path join "toki")
  ^git -C $src status
  print ""
  ^git -C $src log --oneline -5
}
'''

# ── toki:src:open ────────────────────────────────────────────────────────────
["toki:src:open"]
description = "Open toki source in VSCode"
run = '''
#!/usr/bin/env nu

def main [] {
  let src = ($env.SRC_DIR? | default ".src" | path join "toki")
  ^code $src
}
'''

# ── toki:build ───────────────────────────────────────────────────────────────
["toki:build"]
description = "Build toki binary from source into BIN_INSTALL_DIR"
depends = ["toki:src:clone"]
run = '''
#!/usr/bin/env nu

def main [] {
  let src = ($env.SRC_DIR? | default ".src" | path join "toki")
  let dir = ($env.BIN_INSTALL_DIR? | default ".bin")
  mkdir $dir
  let bin = ($dir | path expand | path join "toki")
  ^go -C $src build -o $bin .
}
'''

# ── toki:build:clean ─────────────────────────────────────────────────────────
["toki:build:clean"]
description = "Remove built toki binary"
run = '''
#!/usr/bin/env nu

def main [] {
  let dir = ($env.BIN_INSTALL_DIR? | default ".bin")
  rm -f ($dir | path join "toki")
}
'''

