# Google MCP Server Setup
#
# Integrates google-mcp-server - a Go-based MCP server for Google Workspace.
# Provides: Gmail, Calendar, Drive, Sheets, Docs, Slides
#
# Architecture:
#   mise.toml         - Pins google-mcp-server (upstream release), fnox and jq, and owns the
#                       google:* setup tasks (secret, auth, check, console, rotate)
#   fnox.toml         - OAuth client id/secret resolved from the macOS keychain
#   .mcp.json         - Claude Code runs `mise exec -- fnox exec -- google-mcp-server` (checked in;
#                       the gitignored .vscode/mcp.json, if present, should carry the same entry)
#   This Taskfile     - Stable task names over the mise tasks, plus fork development and Terraform
#
# Source: https://github.com/joeblew999/google-mcp-server (fork of ngs/google-mcp-server)
# Upstream: https://github.com/ngs/google-mcp-server
#
# Usage:
#   task google-mcp:setup         # Full guided setup (install, keychain secrets, sign-in, check)
#   task google-mcp:auth          # Sign a Google account in (opens the browser)
#   task google-mcp:check         # Prove the setup end to end
#   task google-mcp:status        # Binary, secrets, accounts, MCP config
#   task google-mcp:console       # Google Cloud OAuth screens + the exact values to enter
#
# Other Cloud Console pages (project, APIs, ...): task google:auth:open TARGET=<target>

version: '3'

vars:
  # Fork repo for cloning (src:* tasks; Claude Code uses the mise-pinned upstream binary)
  GOOGLE_MCP_FORK: github.com/joeblew999/google-mcp-server
  # Fork builds go to DIR_BUILD (gitignored, project-local)
  GOOGLE_MCP_BIN: '{{.ROOT_DIR}}/{{.DIR_BUILD}}/google-mcp-server'
  ACCOUNTS_DIR: '{{.HOME}}/.google-mcp-accounts'
  # Application-default credentials: written by tf:auth (google auth login) or gcloud
  ADC_FILE: '{{.HOME}}/.config/gcloud/application_default_credentials.json'
  # Source directory for fork development (uses global SRC_DIR)
  GOOGLE_MCP_SRC: '{{.SRC_DIR}}/google-mcp-server'

tasks:
  default:
    desc: Show Google MCP status
    cmds:
      - task: status

  status:
    desc: Check Google MCP configuration status
    cmds:
      - |
        echo "=== Google MCP Server Status ==="
        echo ""

        # Check binary
        if command -v google-mcp-server &>/dev/null; then
          echo "✅ Binary: $(google-mcp-server --version 2>/dev/null) (mise)"
        else
          echo "❌ Binary: NOT INSTALLED"
          echo "   Run: task google-mcp:install"
        fi

        # Check keychain secrets
        for key in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
          if fnox get "$key" >/dev/null 2>&1; then
            echo "✅ Secret: $key in the keychain"
          else
            echo "❌ Secret: $key missing"
            echo "   Run: task google-mcp:credentials"
          fi
        done

        # Check accounts
        if [ -d "{{.ACCOUNTS_DIR}}" ]; then
          account_count=$(ls -1 "{{.ACCOUNTS_DIR}}"/*.json 2>/dev/null | wc -l | tr -d ' ')
          if [ "$account_count" -gt 0 ]; then
            echo "✅ Accounts: $account_count authenticated"
            ls -1 "{{.ACCOUNTS_DIR}}"/*.json 2>/dev/null | xargs -I{} basename {} .json | sed 's/^/   - /'
          else
            echo "❌ Accounts: None authenticated"
            echo "   Run: task google-mcp:auth"
          fi
        else
          echo "❌ Accounts: {{.ACCOUNTS_DIR}} not found"
          echo "   Run: task google-mcp:auth"
        fi

        # Check the MCP configs
        if grep -q 'google-mcp-server' .mcp.json 2>/dev/null; then
          echo "✅ MCP config: .mcp.json has the google server"
        else
          echo "❌ MCP config: .mcp.json has no google server (restore it from git)"
        fi
        if [ -f .vscode/mcp.json ] && ! grep -q '"fnox"' .vscode/mcp.json; then
          echo "⚠️  MCP config: .vscode/mcp.json (local) has an old google entry; copy it from .mcp.json"
        fi

        echo ""

  install:
    desc: Install the mise-pinned google-mcp-server, fnox and jq
    status:
      - command -v google-mcp-server
      - command -v fnox
      - command -v jq
    cmds:
      - mise install github:ngs/google-mcp-server fnox jq

  setup:
    desc: Full Google MCP setup (interactive)
    interactive: true
    cmds:
      - task: install
      - task: credentials
      - task: auth
      - |
        echo ""
        echo "🎉 Setup complete! Restart Claude Code to use Google services."
        echo ""
        echo "Test by asking Claude:"
        echo "  'List my recent Gmail messages'"
        echo "  'Show my Google Calendar events'"

  credentials:
    desc: "Store the OAuth client id/secret in the keychain (prompts only for missing ones)"
    summary: |
      Stores GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in the macOS keychain (fnox.toml),
      prompting with hidden input for whichever is missing.

      Replace one:   mise run google:secret -- GOOGLE_CLIENT_SECRET
      Rotate secret: task google-mcp:rotate
    deps: [install]
    interactive: true
    cmds:
      - |
        for key in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
          if fnox get "$key" >/dev/null 2>&1; then
            echo "✅ $key already in the keychain (replace: mise run google:secret -- $key)"
          else
            mise run google:secret -- "$key"
          fi
        done

  auth:
    desc: "Sign a Google account in to google-mcp-server (opens the browser), then check"
    deps: [install]
    interactive: true
    cmds:
      - mise run google:auth

  check:
    desc: "Prove the setup end to end (token refresh at Google + a real Calendar call)"
    cmds:
      - mise run google:check

  console:
    desc: "Open the Google Cloud OAuth screens and print the exact values to enter"
    aliases: [guide]
    cmds:
      - mise run google:console

  rotate:
    desc: "Rotate the OAuth client secret (you copy the new one in the console)"
    interactive: true
    cmds:
      - mise run google:rotate

  accounts:list:
    desc: List authenticated Google accounts
    cmds:
      - |
        if [ -d "{{.ACCOUNTS_DIR}}" ]; then
          echo "Authenticated accounts:"
          ls -1 "{{.ACCOUNTS_DIR}}"/*.json 2>/dev/null | xargs -I{} basename {} .json || echo "  (none)"
        else
          echo "No accounts directory found"
        fi

  claude:status:
    desc: "Show the Google MCP entry in .mcp.json (checked in, so there is nothing to add)"
    aliases: [claude:add]
    cmds:
      - |
        if grep -q '"fnox"' .mcp.json 2>/dev/null; then
          echo "✅ .mcp.json: mise exec -- fnox exec -- google-mcp-server"
        else
          echo "❌ .mcp.json: no google server entry (restore it from git)"
        fi
        if [ -f .vscode/mcp.json ]; then
          if grep -q '"fnox"' .vscode/mcp.json; then
            echo "✅ .vscode/mcp.json (local): same entry"
          else
            echo "⚠️  .vscode/mcp.json (local): old google entry; copy it from .mcp.json"
          fi
        fi

  reset:
    desc: "Sign out all Google accounts (removes {{.ACCOUNTS_DIR}})"
    summary: |
      Removes the signed-in account tokens. Keychain secrets and the checked-in
      MCP configs are left alone (replace secrets: task google-mcp:credentials,
      rotate the client secret: task google-mcp:rotate).

      Usage:
        task google-mcp:reset           # Dry run (shows what will be removed)
        task google-mcp:reset CONFIRM=y # Actually remove
    vars:
      CONFIRM: '{{.CONFIRM | default ""}}'
    cmds:
      - |
        echo "This will remove: {{.ACCOUNTS_DIR}}/ (signed-in account tokens)"
        echo ""
        if [ "{{.CONFIRM}}" != "y" ]; then
          echo "Dry run - nothing removed."
          echo "To actually remove, run: task google-mcp:reset CONFIRM=y"
          exit 0
        fi
        rm -rf "{{.ACCOUNTS_DIR}}"
        echo "✅ Removed. Sign in again: task google-mcp:auth"

  # ============================================================================
  # Source Development (fork management)
  # ============================================================================

  src:clone:
    desc: Clone the google-mcp-server fork for development
    cmds:
      - mkdir -p "{{.SRC_DIR}}"
      - git clone https://{{.GOOGLE_MCP_FORK}}.git "{{.GOOGLE_MCP_SRC}}"
      - |
        cd "{{.GOOGLE_MCP_SRC}}"
        git remote add upstream https://github.com/ngs/google-mcp-server.git
        echo "✅ Cloned to {{.GOOGLE_MCP_SRC}}"
        echo "   Upstream remote added: ngs/google-mcp-server"
        echo ""
        echo "To install from local source:"
        echo "   task google-mcp:src:install"
    status:
      - test -d "{{.GOOGLE_MCP_SRC}}/.git"

  src:sync:
    desc: Sync fork with upstream (fetch + rebase)
    dir: '{{.GOOGLE_MCP_SRC}}'
    cmds:
      - git fetch upstream
      - git rebase upstream/master
      - |
        echo "✅ Synced with upstream"
        echo ""
        echo "To push changes to your fork:"
        echo "  cd {{.GOOGLE_MCP_SRC}} && git push origin master"
    preconditions:
      - sh: test -d "{{.GOOGLE_MCP_SRC}}/.git"
        msg: "Fork not cloned. Run: task google-mcp:src:clone"

  src:install:
    desc: Install from local source (for development)
    dir: '{{.GOOGLE_MCP_SRC}}'
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/{{.DIR_BUILD}}"
      - |
        echo "Installing from local source..."
        echo "Source: {{.GOOGLE_MCP_SRC}}"
        echo "Target: {{.GOOGLE_MCP_BIN}}"
        echo ""
        # GOWORK=off prevents go.work from interfering with module resolution
        GOWORK=off GOBIN="{{.ROOT_DIR}}/{{.DIR_BUILD}}" go install .
        echo ""
        echo "✅ Installed from local source to {{.GOOGLE_MCP_BIN}}"
    preconditions:
      - sh: test -d "{{.GOOGLE_MCP_SRC}}/.git"
        msg: "Fork not cloned. Run: task google-mcp:src:clone"

  src:open:
    desc: Open fork source directory
    cmds:
      - open "{{.GOOGLE_MCP_SRC}}"
    preconditions:
      - sh: test -d "{{.GOOGLE_MCP_SRC}}"
        msg: "Fork not cloned. Run: task google-mcp:src:clone"

  # ============================================================================
  # Terraform - API enablement (alternative to manual clicking)
  # ============================================================================

  tf:check:deps:
    desc: "Check Terraform dependencies (terraform + application-default credentials; gcloud not needed)"
    cmds:
      - |
        echo "Checking Terraform dependencies..."
        missing=0

        # Check terraform
        if command -v terraform &>/dev/null; then
          echo "✅ terraform: $(terraform version -json 2>/dev/null | grep -o '"terraform_version":"[^"]*"' | cut -d'"' -f4 || terraform version | head -1)"
        else
          echo "❌ terraform: not installed"
          echo "   Install: task google-mcp:tf:install:deps"
          missing=1
        fi

        # Application-default credentials (what the Terraform Google provider reads)
        if [ -f "{{.ADC_FILE}}" ]; then
          echo "✅ credentials: {{.ADC_FILE}}"
        else
          echo "❌ credentials: none"
          echo "   Run: task google-mcp:tf:auth   (no gcloud needed)"
          missing=1
        fi

        if [ $missing -eq 1 ]; then
          exit 1
        fi
    status:
      - command -v terraform
      - test -f "{{.ADC_FILE}}"

  tf:install:deps:
    desc: "Install Terraform (mise-pinned); gcloud is optional"
    cmds:
      - mise install terraform
      - |
        echo ""
        echo "gcloud CLI is OPTIONAL (only tf:auth:manual uses it):"
        echo "  macOS: brew install --cask google-cloud-sdk"
        echo "  Other: https://cloud.google.com/sdk/docs/install"
        echo ""
        echo "Without gcloud, authenticate with: task google-mcp:tf:auth ACCOUNT=your@email.com"

  tf:auth:
    desc: "Authenticate for Terraform (writes gcloud application-default credentials, no gcloud needed)"
    summary: |
      Opens your default browser (passkeys work) and saves application-default
      credentials via the google CLI (task google:auth:login).
      Specify ACCOUNT to pre-select your Google account.

      Usage:
        task google-mcp:tf:auth                          # Prompts for account
        task google-mcp:tf:auth ACCOUNT=user@gmail.com   # Pre-selects account
    aliases: [tf:auth:passkey, tf:auth:assisted]
    cmds:
      - task: :google:auth:login
        vars:
          ACCOUNT: '{{.ACCOUNT | default ""}}'

  tf:auth:manual:
    desc: "Authenticate using gcloud CLI (manual code entry)"
    cmds:
      - |
        if ! command -v gcloud &>/dev/null; then
          echo "❌ gcloud CLI not installed"
          echo ""
          echo "Alternative authentication (no gcloud needed):"
          echo "  task google-mcp:tf:auth       # Opens browser"
          echo ""
          echo "To install gcloud CLI:"
          echo "  task google-mcp:tf:install:deps"
          exit 1
        fi

        if gcloud auth application-default print-access-token &>/dev/null 2>&1; then
          echo "✅ Already authenticated with gcloud"
          echo ""
          echo "To re-authenticate, run:"
          echo "  gcloud auth application-default revoke"
          echo "  task google-mcp:tf:auth:manual"
        else
          echo "════════════════════════════════════════════════════════════════"
          echo "  GCLOUD AUTHENTICATION (Manual Code Entry)"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          echo "1. A URL will be shown below"
          echo "2. Open it in your browser and sign in"
          echo "3. Copy the authorization code"
          echo "4. Paste it here when prompted"
          echo ""
          gcloud auth application-default login --no-launch-browser
        fi
    interactive: true

  tf:init:
    desc: "Initialize Terraform for Google API setup"
    dir: "{{.ROOT_DIR}}/terraform/google-mcp"
    deps: [tf:check:deps]
    cmds:
      - terraform init
    status:
      - test -d "{{.ROOT_DIR}}/terraform/google-mcp/.terraform"

  tf:plan:
    desc: "Plan Google API enablement"
    dir: "{{.ROOT_DIR}}/terraform/google-mcp"
    deps: [tf:init]
    cmds:
      - |
        if [ ! -f terraform.tfvars ]; then
          echo "Error: terraform.tfvars not found"
          echo "Copy terraform.tfvars.example to terraform.tfvars and set your project ID"
          exit 1
        fi
        terraform plan

  tf:apply:
    desc: "Enable all Google APIs via Terraform"
    dir: "{{.ROOT_DIR}}/terraform/google-mcp"
    deps: [tf:init]
    cmds:
      - |
        if [ ! -f terraform.tfvars ]; then
          echo "Error: terraform.tfvars not found"
          echo "Run: task google-mcp:tf:setup"
          exit 1
        fi
        terraform apply -auto-approve

  tf:destroy:
    desc: "Disable all Google APIs via Terraform (use with caution)"
    dir: "{{.ROOT_DIR}}/terraform/google-mcp"
    prompt: "This will disable APIs. Are you sure?"
    cmds:
      - terraform destroy

  tf:status:
    desc: "Show Terraform state for Google APIs"
    dir: "{{.ROOT_DIR}}/terraform/google-mcp"
    cmds:
      - |
        echo "=== Terraform State ==="
        if [ -f terraform.tfstate ]; then
          terraform output
        else
          echo "No Terraform state found."
          echo "Run: task google-mcp:tf:apply"
        fi
        echo ""
        echo "=== tfvars ==="
        if [ -f terraform.tfvars ]; then
          cat terraform.tfvars
        else
          echo "No terraform.tfvars found."
        fi

  tf:setup:
    desc: "Full Terraform setup - install deps, configure, and apply"
    cmds:
      - |
        echo "════════════════════════════════════════════════════════════════"
        echo "  TERRAFORM SETUP - Enable Google APIs"
        echo "════════════════════════════════════════════════════════════════"
        echo ""

        # Step 1: Check/install dependencies
        echo "Step 1: Checking dependencies..."
        if ! command -v terraform &>/dev/null; then
          echo "Installing terraform..."
          mise install terraform
        fi
        echo "✅ terraform installed"

        # Step 2: Application-default credentials (Terraform's Google provider reads these)
        echo ""
        echo "Step 2: Checking credentials..."
        if [ ! -f "{{.ADC_FILE}}" ]; then
          echo "Signing in (opens the browser; no gcloud needed)..."
          task google-mcp:tf:auth
        fi
        echo "✅ credentials: {{.ADC_FILE}}"

        # Step 3: Configure project
        echo ""
        echo "Step 3: Configuring project..."
        cd "{{.ROOT_DIR}}/terraform/google-mcp"

        if [ ! -f terraform.tfvars ]; then
          echo ""
          echo "Enter your Google Cloud Project ID:"
          read -r project_id
          if [ -z "$project_id" ]; then
            echo "❌ Project ID cannot be empty"
            exit 1
          fi
          echo "project_id = \"$project_id\"" > terraform.tfvars
          echo "✅ Created terraform.tfvars"
        else
          echo "✅ terraform.tfvars exists"
          cat terraform.tfvars
        fi

        # Step 4: Initialize and apply
        echo ""
        echo "Step 4: Initializing Terraform..."
        terraform init

        echo ""
        echo "Step 5: Applying (enabling APIs)..."
        terraform apply -auto-approve

        echo ""
        echo "════════════════════════════════════════════════════════════════"
        echo "  ✅ SETUP COMPLETE"
        echo "════════════════════════════════════════════════════════════════"
        echo ""
        terraform output
