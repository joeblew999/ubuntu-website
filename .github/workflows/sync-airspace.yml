# FAA Airspace Data Sync Workflow
#
# Syncs FAA airspace data from ArcGIS to Cloudflare R2.
# Uses ETag tracking to only download changed files.
# Uses pure Go tiler (gotiler) - no external dependencies like tippecanoe.
#
# Schedule: Weekly on Thursday (aligned with AIRAC cycle midpoint)
# Manual: workflow_dispatch for on-demand sync
#
# R2 Upload requires CLOUDFLARE_API_TOKEN secret with R2 permissions.

name: "[Sync] Airspace Data"

on:
  schedule:
    # Run weekly on Thursday at 06:00 UTC
    # AIRAC cycles are every 28 days; Thursday midweek catches most updates
    - cron: '0 6 * * 4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-download all data'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.15
          cache: true



      - name: Restore sync cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/airspace/sync_etags.json
          key: airspace-sync-${{ github.run_id }}
          restore-keys: |
            airspace-sync-

      - name: Run pipeline
        id: pipeline
        run: |
          # mise run airspace:pipeline: sync → tile (if changed) → manifest, with the Go tiler (no tippecanoe needed)
          mise run airspace:pipeline --tiler gotiler ${{ inputs.force == 'true' && '--force' || '' }}

      - name: Check for changes
        id: check_changes
        run: mise run airspace:check >> "$GITHUB_OUTPUT"

      - name: Upload to R2
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: mise run airspace:upload

      - name: Skip notification
        if: steps.check_changes.outputs.has_changes != 'true'
        run: echo "No changes detected - pipeline skipped tile/manifest/upload (idempotent)"

      - name: Save sync cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: data/airspace/sync_etags.json
          key: airspace-sync-${{ github.run_id }}

      - name: Summary
        run: mise run airspace:summary
