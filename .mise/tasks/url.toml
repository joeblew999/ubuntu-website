# The site's pages and dashboards, opened in the browser on any OS. Each url:<command> runs the url binary's command,
# cmd/url/<command>.go; misecheck holds them together.

["url:build"]
description = "Build url (cmd/url) into bin/: the url:* tasks run it"
run = 'go build -o bin/ ./cmd/url'

["url:dev"]
description = "Open the local Hugo dev server (http://localhost:1313)"
depends = ["url:build"]
run = 'url dev'

["url:prod"]
description = "Open the production site (www.ubuntusoftware.net)"
depends = ["url:build"]
run = 'url prod'

["url:preview"]
description = "Open the site's Worker at its own workers.dev address (main's build)"
depends = ["url:build"]
run = 'url preview'

["url:branch"]
description = "Open this branch's Worker preview (Workers Builds deploys one for every branch but main)"
depends = ["url:build"]
run = 'url branch'

["url:search-console"]
description = "Open Google Search Console"
depends = ["url:build"]
run = 'url search-console'

["url:cf-analytics"]
description = "Open Cloudflare Web Analytics for the site"
depends = ["url:build"]
run = 'url cf-analytics'

["url:cf-worker"]
description = "Open the site's Worker in Cloudflare's dashboard (deployments, builds, domains, logs)"
depends = ["url:build"]
run = 'url cf-worker'

["url:cf-domain"]
description = "Open the domain's Cloudflare dashboard (DNS, rules, email)"
depends = ["url:build"]
run = 'url cf-domain'

["url:cf-ai"]
description = "Open Cloudflare's AI Crawl Control (which AI crawlers may read the site)"
depends = ["url:build"]
run = 'url cf-ai'

["url:cf-r2"]
description = "Open the R2 dashboard (the bucket of large assets, ubuntu-website-assets)"
depends = ["url:build"]
run = 'url cf-r2'
