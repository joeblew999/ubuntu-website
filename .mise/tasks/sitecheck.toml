# Is the site reachable from around the world? check-host.net's nodes check it (no account, no secret); SITE_URL
# checks another site. Each task runs one command of the sitecheck binary, cmd/sitecheck/<command>.go; misecheck holds
# the two together (mise run root:check-mise).
#   mise run sitecheck:all                       every check
#   mise run sitecheck:http --nodes 10 --wait 5   a quick one
# The scheduled one, every 6 hours, is .github/workflows/monitor-sitecheck.yml: mise run sitecheck:issue.

["sitecheck:build"]
description = "Build sitecheck (cmd/sitecheck) into bin/: the sitecheck:* tasks run it"
run = 'go build -o bin/ ./cmd/sitecheck'

["sitecheck:http"]
description = "The site's robots.txt over HTTP from every node: fails on 3 failures or more (1 or 2 are noise)"
usage = 'flag "--url <url>" help="URL to check (default: SITE_URL robots.txt)"; flag "--nodes <n>" help="Most nodes to check from (default 56)"; flag "--wait <seconds>" help="Seconds to wait for their results (default 8)"'
depends = ["sitecheck:build"]
run = 'sitecheck http{% if usage.url %} --url "{{usage.url}}"{% endif %}{% if usage.nodes %} --nodes {{usage.nodes}}{% endif %}{% if usage.wait %} --wait {{usage.wait}}{% endif %}'

["sitecheck:dns"]
description = "The site's domain resolves, from every node"
usage = 'flag "--url <url>" help="URL or domain to check (default: SITE_URL)"; flag "--nodes <n>" help="Most nodes to check from (default 56)"; flag "--wait <seconds>" help="Seconds to wait for their results (default 8)"'
depends = ["sitecheck:build"]
run = 'sitecheck dns{% if usage.url %} --url "{{usage.url}}"{% endif %}{% if usage.nodes %} --nodes {{usage.nodes}}{% endif %}{% if usage.wait %} --wait {{usage.wait}}{% endif %}'

["sitecheck:tcp"]
description = "The site's port 443 answers, from every node"
usage = 'flag "--url <url>" help="URL or domain to check (default: SITE_URL)"; flag "--nodes <n>" help="Most nodes to check from (default 56)"; flag "--wait <seconds>" help="Seconds to wait for their results (default 8)"'
depends = ["sitecheck:build"]
run = 'sitecheck tcp{% if usage.url %} --url "{{usage.url}}"{% endif %}{% if usage.nodes %} --nodes {{usage.nodes}}{% endif %}{% if usage.wait %} --wait {{usage.wait}}{% endif %}'

["sitecheck:redirect"]
description = "The apex domain (ubuntusoftware.net) redirects to www, from every node"
usage = 'flag "--url <url>" help="The site whose apex to check (default: SITE_URL)"; flag "--nodes <n>" help="Most nodes to check from (default 56)"; flag "--wait <seconds>" help="Seconds to wait for their results (default 8)"'
depends = ["sitecheck:build"]
run = 'sitecheck redirect{% if usage.url %} --url "{{usage.url}}"{% endif %}{% if usage.nodes %} --nodes {{usage.nodes}}{% endif %}{% if usage.wait %} --wait {{usage.wait}}{% endif %}'

["sitecheck:all"]
description = "Every check, dns, tcp, redirect and http, one after the other: fails if any does"
usage = 'flag "--url <url>" help="URL to check (default: SITE_URL robots.txt)"; flag "--nodes <n>" help="Most nodes to check from (default 56)"; flag "--wait <seconds>" help="Seconds to wait for their results (default 8)"'
depends = ["sitecheck:build"]
run = 'sitecheck all{% if usage.url %} --url "{{usage.url}}"{% endif %}{% if usage.nodes %} --nodes {{usage.nodes}}{% endif %}{% if usage.wait %} --wait {{usage.wait}}{% endif %}'

["sitecheck:issue"]
description = "The scheduled check (monitor-sitecheck.yml): HTTP from every node compared with the last run (.sitecheck-state.json), as markdown for a GitHub issue; fails when it finds one"
usage = 'flag "--report <file>" help="Also write the markdown report to this file"; flag "--url <url>" help="URL to check (default: SITE_URL robots.txt)"; flag "--nodes <n>" help="Most nodes to check from (default 56)"; flag "--wait <seconds>" help="Seconds to wait for their results (default 8)"'
depends = ["sitecheck:build"]
run = 'sitecheck issue{% if usage.report %} --report "{{usage.report}}"{% endif %}{% if usage.url %} --url "{{usage.url}}"{% endif %}{% if usage.nodes %} --nodes {{usage.nodes}}{% endif %}{% if usage.wait %} --wait {{usage.wait}}{% endif %}'
