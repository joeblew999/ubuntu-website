#:schema https://mise.jdx.dev/schema/mise.json

# ubuntu-website's control plane: every tool pinned (tasks never install tools: add new ones to [tools]), the
# settings and env every task runs with, and the tasks that act on the whole repo. The work itself is in task files,
# one per Go binary, .mise/tasks/<binary>.toml: tasks named <binary>:<command>, each running <binary> <command>
# (cmd/<binary>/<command>.go), built into bin/ by <binary>:build. They carry no tools or env of their own.
#
#   mise run root:ci            what CI runs, the same here: every check below (CI's workflow runs only this)
#   mise run root:check-mise    misecheck on this file and every task file: each held to its own binary, both ways
#   mise run root:test          the Go: vet and tests of every package, and the Workers build (js/wasm) vetted
#   mise run root:build         the site, as production builds it
#   mise run root:cloudflare-build   Cloudflare's build of the Worker: root:build, with only the tools it runs installed
#   mise tasks                  every task, with its file
#
# New machine: mise trust && mise run root:setup, then a domain's own first steps (e.g. mise run google-mcp:setup).

# The mise CI (core-ci.yml) and Cloudflare's Workers Builds (its build command, root:cloudflare-build) run, exactly;
# anywhere else, at least.
min_version = "2026.9.15"

# Values never shown in task output: the secrets .env and CI pass in, by name.
redactions = ["*_TOKEN", "*_KEY", "*_PASSWORD", "*_SECRET"]

[settings]
# go.mod's toolchain line is the Go pin; this makes `mise install` honour it.
idiomatic_version_file_enable_tools = ["go"]
# npm: tools (wrangler) are installed by mise's own embedded aube, the package manager the site uses too.
npm.package_manager = "aube"

[tools]
# Local, CI and Cloudflare's Workers Builds (root:cloudflare-build installs it there); see CLAUDE.md Hugo Version.
hugo-extended = "0.169.0"
# node is the one JavaScript runtime (Hugo's Tailwind, the theme generator); aube installs the site's npm packages
# (package.json, pnpm-lock.yaml in pnpm's format, build approvals in aube-workspace.yaml), and only that.
node = "26.13.0"
aube = "2.9.0"
# Dev process orchestration (dev:up / process-compose.yaml); not in Homebrew core.
process-compose = "1.124.0"
# GitHub CLI (tools:gh:*, release tasks).
gh = "2.103.3"
# Google API enablement (google-mcp:tf:*, terraform/google-mcp).
terraform = "1.17.1"
# Google MCP server (.mcp.json): upstream release binary, exact version.
"github:ngs/google-mcp-server" = "0.8.0"
# Search Console (+ Bing Webmaster Tools, GA4) as an MCP server for Claude (.mcp.json) and a CLI for checks
# (search-console:*): index status, sitemaps, search performance. Read-only unless setup grants more; it signs in
# through our OAuth client (GOOGLE_CLIENT_ID/SECRET via fnox), its tokens in the macOS keychain. Chosen 2026-11-04
# over AminForou/mcp-gsc (always full write scope, no releases, MCP only) and the others (TODO.md).
"npm:search-console-mcp" = "2.1.4"
# Resolves the Google servers' GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET from the keychain (fnox.toml).
fnox = { version = "1.47.0", workflow = "release.yml" }
# JSON, by hand (the Go parses its own).
jq = "1.8.2"
# The GitHub workflows, linted (root:check-workflows, in root:ci); actionlint checks their run steps with shellcheck.
actionlint = "1.7.12"
shellcheck = "0.11.0"
# The workflows' actions pinned to commit SHAs (root:check-actions, in root:ci), and updated (upgrade:actions).
pinact = "5.0.2"
# Cloudflare's own CLI (its API on its own login, no token in .env): cache purge, Email Routing (cf:*). Beta; the version
# mise-cloudflare pins too.
"npm:cf" = "1.0.0-beta.26"
# Git LFS: static/videos/*.mp4 are LFS files (.gitattributes).
git-lfs = "3.8.1"
# Go module upgrades incl. major versions (upgrade:modules).
"aqua:oligot/go-mod-upgrade" = "0.13.0"

[env]
# API keys and tokens (DEEPL_API_KEY, UBUNTU_WEBSITE_CF_TOKEN, MAILERLITE_API_KEY, …) from .env, gitignored; none in
# CI. Never CLOUDFLARE_API_TOKEN or CF_API_TOKEN: wrangler would use either over the repo's own login. The secret ones are redacted from task output (redactions, above).
_.file = ".env"
# Each <binary>:build puts its binary here, and aube the npm packages' (wrangler, pinned in package.json): the tasks run
# them by name.
_.path = ["{{config_root}}/bin", "{{config_root}}/node_modules/.bin"]
# Google Cloud project (number) that owns the OAuth client. Not secret.
UBUNTU_WEBSITE_GCP_PROJECT = "130034768106"

[task_config]
# The task files, one per Go binary (mise loads this folder by default; named here so the control plane says so).
includes = [".mise/tasks"]

[tasks."root:check-mise"]
description = "misecheck (github.com/joeblew999/mise-check) on every mise file here: this one, and each .mise/tasks/<binary>.toml strictly against cmd/<binary>/ (each command a task, each task's command there, the task names its Go prints all tasks): one line each, usage passed by name, no POSIX shell syntax"
run = 'go test . -run "^TestMise$" -count=1 -v'

[tasks."root:ci"]
description = "What CI runs, and the same here: misecheck, the workflows linted and their actions pinned, the Go, the theme CSS current, the site's production build and every link in it landing. CI's workflow runs only this task"
depends = ["root:check-mise", "root:check-workflows", "root:check-actions", "root:test", "root:test-worker", "theme:check", "root:build", "sitecheck:links"]

[tasks."root:check-workflows"]
description = "The GitHub workflows (.github/workflows/*.yml) linted with actionlint: YAML, expressions, action inputs, and the shell of their run steps"
run = 'actionlint'

[tasks."root:check-actions"]
description = "Every action the workflows use is pinned to a commit SHA with its version as a comment (pinact, offline: no GitHub API, no token)"
run = 'pinact run --fix=false --no-api'

[tasks."root:setup"]
description = "A new machine, after mise trust: every pinned tool installed, the npm packages, the Go modules"
run = 'mise install && mise run root:deps && go mod download'

[tasks."root:fmt"]
description = "The Go formatted (go fmt)"
run = 'go fmt ./...'

[tasks."root:test"]
description = "The Go: go vet and the tests of every package"
run = 'go vet ./... && go test ./... -count=1'

[tasks."root:test-worker"]
description = "The Workers build of cmd/worker-tiler (js/wasm), vetted: go vet ./... doesn't build it"
env = { GOOS = "js", GOARCH = "wasm" }
run = 'go vet ./cmd/worker-tiler'

[tasks."root:deps"]
alias = "setup"
description = "The site's npm packages (Tailwind, its plugins, wrangler), with aube from pnpm-lock.yaml (mise-cloudflare's setup, too): it fails if the lockfile and package.json disagree, and on any dependency build script not reviewed (aube-workspace.yaml)"
run = 'aube install --frozen-lockfile'

[tasks."root:build"]
description = "The site as production builds it (hugo -e production --gc --minify) into public/, emptied first (no page a dev server or an older build left there), with the theme CSS as committed (theme:check): refLinksErrorLevel makes a broken relref fail it, sitecheck:links any other link. Preview builds are the same build"
depends = ["root:deps"]
run = 'hugo -e production --gc --minify --cleanDestinationDir'

[tasks."root:cloudflare-build"]
description = "Cloudflare's build of the Worker (Workers Builds, production and every branch's preview): its build command is npx -y @jdxcode/mise@<min_version> run --skip-tools root:cloudflare-build. Cloudflare's image brings node and installs the npm packages itself (pnpm, from pnpm-lock.yaml), so this installs only Hugo, then the build without root:deps; wrangler deploys what it built"
run = 'mise install hugo-extended && mise run --skip-tools --skip-deps root:build'

