# tasks/sitecheck.toml — sitecheck:* namespace: site reachability checks.
# Ported from taskfiles/Taskfile.sitecheck.yml. Wraps cmd/sitecheck.

# ── sitecheck:http ───────────────────────────────────────────────────────────
["sitecheck:http"]
description = "Check site HTTP reachability from all global locations"
run = '''
#!/usr/bin/env nu

def main [] {
  ^go run ./cmd/sitecheck
}
'''

# ── sitecheck:dns ────────────────────────────────────────────────────────────
["sitecheck:dns"]
description = "Check DNS resolution from all global locations"
run = '''
#!/usr/bin/env nu

def main [] {
  ^go run ./cmd/sitecheck -type dns
}
'''

# ── sitecheck:tcp ────────────────────────────────────────────────────────────
["sitecheck:tcp"]
description = "Check TCP port 443 from all global locations"
run = '''
#!/usr/bin/env nu

def main [] {
  ^go run ./cmd/sitecheck -type tcp
}
'''

# ── sitecheck:redirect ───────────────────────────────────────────────────────
["sitecheck:redirect"]
description = "Check apex domain redirects to www"
run = '''
#!/usr/bin/env nu

def main [] {
  ^go run ./cmd/sitecheck -type redirect
}
'''

# ── sitecheck:all ────────────────────────────────────────────────────────────
["sitecheck:all"]
description = "Run all site checks (DNS, TCP, redirect, HTTP)"
depends = ["sitecheck:dns", "sitecheck:tcp", "sitecheck:redirect", "sitecheck:http"]
